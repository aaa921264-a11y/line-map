name: 電桿街景照片(Mapillary)

# 找某個位置附近、朝向電桿的 Mapillary 街景照片,下載後存到 raw-data 分支,讓 Claude 辨識電桿上的裝置物。
# 需要 repo 的 Secret:MAPILLARY_TOKEN(Mapillary 的 Client Token,MLY| 開頭)。
on:
  workflow_dispatch:
    inputs:
      lat: { description: "緯度", required: true }
      lng: { description: "經度", required: true }
      label: { description: "名稱(英數字,例如 minyi43)", required: true, default: "pole" }
      radius: { description: "搜尋半徑(公尺)", required: false, default: "40" }
      max: { description: "最多幾張", required: false, default: "6" }

permissions:
  contents: write

concurrency:
  group: streetview
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: raw-data }
      - name: 找照片並下載
        env:
          TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          LAT: ${{ inputs.lat }}
          LNG: ${{ inputs.lng }}
          LABEL: ${{ inputs.label }}
          RADIUS: ${{ inputs.radius }}
          MAX: ${{ inputs.max }}
        run: |
          python3 - <<'PY'
          import json, math, os, re, sys, time, urllib.request, urllib.parse, datetime
          tok = os.environ.get('TOKEN', '')
          lat, lng = float(os.environ['LAT']), float(os.environ['LNG'])
          r = float(os.environ.get('RADIUS') or 40); mx = int(os.environ.get('MAX') or 6)
          label = re.sub(r'[^A-Za-z0-9_-]', '', os.environ.get('LABEL') or 'pole')[:40] or 'pole'
          stamp = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y%m%d-%H%M%S')
          out = f'streetview/{stamp}-{label}'; os.makedirs(out, exist_ok=True)
          meta = {'pole': {'lat': lat, 'lng': lng}, 'radius_m': r, 'source': 'Mapillary (CC BY-SA 4.0)', 'images': [], 'status': 'ok'}
          if not tok:
              meta['status'] = 'no_token'
          else:
              dlat = r / 111320; dlng = r / (111320 * math.cos(math.radians(lat)))
              q = urllib.parse.urlencode({'access_token': tok, 'fields': 'id,captured_at,compass_angle,computed_compass_angle,computed_geometry,geometry,is_pano,thumb_2048_url,creator',
                                          'bbox': f'{lng-dlng},{lat-dlat},{lng+dlng},{lat+dlat}', 'limit': 200})
              try:
                  data = json.load(urllib.request.urlopen('https://graph.mapillary.com/images?' + q, timeout=60)).get('data', [])
              except Exception as e:
                  meta['status'] = 'api_error'; meta['error'] = str(e)[:300]; data = []
              rows = []
              for im in data:
                  g = (im.get('computed_geometry') or im.get('geometry') or {}).get('coordinates')
                  if not g: continue
                  x, y = g[0], g[1]
                  dx = (lng - x) * 111320 * math.cos(math.radians(lat)); dy = (lat - y) * 111320
                  d = math.hypot(dx, dy); brg = (math.degrees(math.atan2(dx, dy)) + 360) % 360
                  ang = im.get('computed_compass_angle', im.get('compass_angle'))
                  off = 0 if im.get('is_pano') else (abs((brg - ang + 540) % 360 - 180) if ang is not None else 90)
                  if d > r or (not im.get('is_pano') and off > 70): continue
                  rows.append((off / 70 + d / r - im.get('captured_at', 0) / 1e13, d, off, brg, im))
              rows.sort(key=lambda t: t[0])
              for score, d, off, brg, im in rows[:mx]:
                  fn = f"{im['id']}.jpg"
                  try:
                      urllib.request.urlretrieve(im['thumb_2048_url'], f'{out}/{fn}')
                  except Exception as e:
                      continue
                  meta['images'].append({'file': fn, 'id': im['id'], 'distance_m': round(d, 1), 'pole_bearing_from_camera': round(brg), 'off_axis_deg': round(off),
                                         'is_pano': bool(im.get('is_pano')), 'captured': datetime.datetime.utcfromtimestamp(im.get('captured_at', 0) / 1000).strftime('%Y-%m-%d'),
                                         'url': f"https://www.mapillary.com/app/?pKey={im['id']}", 'by': (im.get('creator') or {}).get('username', '')})
                  time.sleep(0.3)
              meta['found_nearby'] = len(rows)
          json.dump(meta, open(f'{out}/meta.json', 'w'), ensure_ascii=False, indent=1)
          print(json.dumps({k: meta[k] for k in ('status', 'found_nearby') if k in meta}, ensure_ascii=False), len(meta['images']), 'images ->', out)
          PY
      - name: 存回 raw-data 分支
        run: |
          git config user.name "line-map-bot"; git config user.email "line-map-bot@users.noreply.github.com"
          git add streetview && git commit -qm "街景照片 ${{ inputs.label }}" && git push origin HEAD:raw-data
