name: fetch-video
on:
  workflow_dispatch:
    inputs:
      url:
        description: 影片網址
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper
      - name: Download
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p out
          yt-dlp --no-playlist --write-info-json -o "out/video.%(ext)s" "$URL" 2>&1 | tee out/yt-dlp.log || true
          ls -la out
      - name: Frames and transcript
        run: |
          V=$(ls out/video.* 2>/dev/null | grep -v info.json | head -1)
          if [ -n "$V" ]; then
            ffmpeg -loglevel error -i "$V" -vf "fps=1/3,scale=480:-1" out/frame_%03d.jpg || true
            ffmpeg -loglevel error -i "$V" -vn -ac 1 -ar 16000 out/audio.wav || true
            python - <<'PY'
          from faster_whisper import WhisperModel
          import os
          if os.path.exists("out/audio.wav"):
              m = WhisperModel("small", device="cpu", compute_type="int8")
              segs, info = m.transcribe("out/audio.wav", vad_filter=True)
              with open("out/transcript.txt", "w") as f:
                  f.write(f"lang={info.language} p={info.language_probability:.2f}\n")
                  for s in segs:
                      f.write(f"[{s.start:.0f}s] {s.text.strip()}\n")
          PY
            rm -f out/audio.wav "$V"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: video-result
          path: out/
