name: fetch-video
on:
  workflow_dispatch:
    inputs:
      url:
        description: 影片網址
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper av
      - name: Download
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p out
          yt-dlp --no-playlist --write-info-json -o "out/video.%(ext)s" "$URL" 2>&1 | tee out/yt-dlp.log || true
          ls -la out
      - name: Frames and transcript
        continue-on-error: true
        run: |
          V=$(ls out/video.* 2>/dev/null | grep -v info.json | head -1)
          if [ -n "$V" ]; then
            ffmpeg -loglevel error -i "$V" -vf "fps=1/3,scale=480:-1" out/frame_%03d.jpg || true
            ffmpeg -loglevel error -i "$V" -vn -ac 1 -ar 16000 -c:a pcm_s16le out/audio.wav || true
            python - <<'PY'
          from faster_whisper import WhisperModel
          import os
          if os.path.exists("out/audio.wav"):
              m = WhisperModel("small", device="cpu", compute_type="int8")
              import wave, numpy as np
              w = wave.open("out/audio.wav")
              audio = np.frombuffer(w.readframes(w.getnframes()), np.int16).astype(np.float32) / 32768.0
              segs, info = m.transcribe(audio, vad_filter=True)
              with open("out/transcript.txt", "w") as f:
                  f.write(f"lang={info.language} p={info.language_probability:.2f}\n")
                  for s in segs:
                      f.write(f"[{s.start:.0f}s] {s.text.strip()}\n")
          PY
            rm -f out/audio.wav
          fi
      - name: Push results to branch
        if: always()
        run: |
          cd out
          python3 -c "import json;d=json.load(open('video.info.json'));open('meta.txt','w').write('\n'.join(f'{k}: {d.get(k)}' for k in ['title','description','uploader','upload_date','duration','view_count','like_count','comment_count','webpage_url']))" || true
          rm -f video.info.json
          git init -q && git checkout -q -b video-results
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "result ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" video-results
