name: fetch-video
on:
  workflow_dispatch:
    inputs:
      url:
        description: 影片網址
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper av
      - name: Download
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p out
          echo "URL: $URL" > out/source.txt
          yt-dlp --no-playlist --write-info-json -o "out/video.%(ext)s" "$URL" 2>&1 | tee out/yt-dlp.log || true
          python3 -c "import json;d=json.load(open('out/video.info.json'));open('out/meta.txt','w').write('\n'.join(f'{k}: {d.get(k)}' for k in ['title','description','uploader','upload_date','duration','view_count','like_count','comment_count','webpage_url']))" || true
          rm -f out/video.info.json
          ls -la out
      - name: Frames
        continue-on-error: true
        run: |
          V=$(ls out/video.* 2>/dev/null | head -1)
          [ -z "$V" ] && exit 0
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V" | cut -d. -f1)
          FPS=$(python3 -c "d=max(int('${DUR:-60}' or 60),1);print(min(1/3,40/d))")
          echo "duration=$DUR fps=$FPS" | tee -a out/source.txt
          ffmpeg -loglevel error -i "$V" -vf "fps=$FPS,scale=480:-1" out/frame_%03d.jpg || true
      - name: Transcript
        continue-on-error: true
        timeout-minutes: 25
        run: |
          V=$(ls out/video.* 2>/dev/null | head -1)
          [ -z "$V" ] && exit 0
          ffmpeg -loglevel error -i "$V" -vn -ac 1 -ar 16000 -c:a pcm_s16le out/audio.wav || true
          python - <<'PY'
          import os, wave, subprocess
          import numpy as np
          from faster_whisper import WhisperModel
          if os.path.exists("out/audio.wav"):
              w = wave.open("out/audio.wav")
              n = w.getnframes()
              dur = n / 16000
              model = "small" if dur <= 300 else "base"
              m = WhisperModel(model, device="cpu", compute_type="int8")
              audio = np.frombuffer(w.readframes(n), np.int16).astype(np.float32) / 32768.0
              segs, info = m.transcribe(audio, vad_filter=True, beam_size=1)
              with open("out/transcript.txt", "w") as f:
                  f.write(f"lang={info.language} p={info.language_probability:.2f} model={model} dur={dur:.0f}s\n")
                  for s in segs:
                      f.write(f"[{s.start:.0f}s] {s.text.strip()}\n")
                      f.flush()
          PY
          rm -f out/audio.wav
      - name: Push results to branch
        if: always()
        run: |
          cd out
          for f in video.*; do
            [ -f "$f" ] && [ "$(stat -c %s "$f")" -gt 90000000 ] && { echo "$f 太大，未上傳" >> source.txt; rm -f "$f"; }
          done
          git init -q && git checkout -q -b video-results
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "result ${{ github.run_id }}"
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git push -f "$R" video-results:video-${{ github.run_id }}
          git push -f "$R" video-results:video-results
