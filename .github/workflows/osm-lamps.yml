name: 查 OpenStreetMap 路燈(一次性)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lamps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 下載並取出路燈點
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL --retry 3 -o taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
          osmium tags-filter taiwan.osm.pbf n/highway=street_lamp -o lamps.osm.pbf --overwrite
          osmium export lamps.osm.pbf -f geojsonseq -o lamps.geojsonseq --overwrite
          python3 - <<'PY'
          import json, collections
          S, W, N, E = 24.585, 120.975, 25.135, 121.505
          allc = 0; ty = []; tags = collections.Counter()
          for line in open('lamps.geojsonseq', encoding='utf-8'):
              line = line.strip().lstrip('\x1e')
              if not line: continue
              f = json.loads(line); allc += 1
              x, y = f['geometry']['coordinates'][:2]
              if S <= y <= N and W <= x <= E:
                  p = f.get('properties') or {}
                  ty.append({'lng': x, 'lat': y, 'tags': p})
                  tags.update(k for k in p)
          out = {'taiwan_total': allc, 'taoyuan_bbox': len(ty), 'tag_counts': tags.most_common(30),
                 'with_ref': sum(1 for t in ty if 'ref' in t['tags']), 'samples': ty[:30]}
          json.dump(out, open('lamps-summary.json', 'w'), ensure_ascii=False, indent=1)
          json.dump(ty, open('lamps-taoyuan.json', 'w'), ensure_ascii=False)
          print(json.dumps({k: out[k] for k in ['taiwan_total', 'taoyuan_bbox', 'with_ref']}, ensure_ascii=False))
          PY
      - name: 存到 raw-data 分支(不影響網站)
        run: |
          git fetch origin raw-data
          git worktree add raw origin/raw-data && cd raw && git checkout -B raw-data
          mkdir -p osm-lamps && cp ../lamps-summary.json ../lamps-taoyuan.json osm-lamps/
          git config user.name "line-map-bot"; git config user.email "line-map-bot@users.noreply.github.com"
          git add -A && git commit -qm "OpenStreetMap 路燈 $(TZ=Asia/Taipei date +%F)" && git push origin raw-data
