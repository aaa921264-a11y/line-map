<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="定位地圖">
<meta name="robots" content="noindex">
<title>線路定位地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>

/* Layout: one narrow column for one-handed phone use; sticky header, bottom tab bar,
   the shared line map always on top of 線路巡視. Pole plates mimic the real enamel tag. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f4f6f8; --line:#d3d9e0;
  --fg:#16202a; --muted:#5b6774; --soft:#8a95a1;
  --accent:#e59a0b; --accent-ink:#1d1504; --accent-text:#9a5b00; --accent-wash:#fdf1d8;
  --danger:#c23a2b; --danger-wash:#fbe8e5; --ok:#1f7a4c; --ok-wash:#e2f2e9;
  --info:#255f9e; --info-wash:#e5eef8; --violet:#5b3fa0; --violet-wash:#eee8f8;
  --map-bg:#eef0ec; --map-grid:#dfe4e0; --map-grid-strong:#b9c3bc; --map-label:#7d8a82;
  --plate-bg:#fbfbf7; --plate-ink:#111111;
  --road:#ffffff; --road-edge:#aab3ab; --road-label:#3c4640;
  --font-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1418; --surface:#182027; --surface-2:#1f2930; --line:#2d3842;
    --fg:#e5eaee; --muted:#9aa6b1; --soft:#6f7c88;
    --accent:#f0a823; --accent-ink:#1d1504; --accent-text:#f5bc52; --accent-wash:#3a2c10;
    --danger:#ff7a6b; --danger-wash:#3d1d1a; --ok:#5fd19a; --ok-wash:#173327;
    --info:#7fb4ee; --info-wash:#1a2b3e; --violet:#b9a2f2; --violet-wash:#2a2240;
    --map-bg:#141b20; --map-grid:#24303a; --map-grid-strong:#3a4a57; --map-label:#6d7d8a; --road:#2f3d48; --road-edge:#1b232a; --road-label:#a9b6c1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#182027; --surface-2:#1f2930; --line:#2d3842;
  --fg:#e5eaee; --muted:#9aa6b1; --soft:#6f7c88;
  --accent:#f0a823; --accent-ink:#1d1504; --accent-text:#f5bc52; --accent-wash:#3a2c10;
  --danger:#ff7a6b; --danger-wash:#3d1d1a; --ok:#5fd19a; --ok-wash:#173327;
  --info:#7fb4ee; --info-wash:#1a2b3e; --violet:#b9a2f2; --violet-wash:#2a2240;
  --map-bg:#141b20; --map-grid:#24303a; --map-grid-strong:#3a4a57; --map-label:#6d7d8a; --road:#2f3d48; --road-edge:#1b232a; --road-label:#a9b6c1;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;}
.app{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:0 96px;}
h1,h2,h3{text-wrap:balance; margin:0;}
button,input,select,textarea{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg);
  margin-inline:-16px; padding:12px 16px 10px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:12px;}
.top h1{font-size:18px; font-weight:700; letter-spacing:.02em;}
.top .sub{font-size:12px; color:var(--muted);}
.store-chip{font-size:11.5px; padding:3px 9px; border-radius:999px; white-space:nowrap;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}
.store-chip.ok{background:var(--ok-wash); color:var(--ok); border-color:transparent;}
.store-chip.warn{background:var(--accent-wash); color:var(--accent-text); border-color:transparent;}
.store-chip.bad{background:var(--danger-wash); color:var(--danger); border-color:transparent;}

/* tab bar */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); display:flex; justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.tabbar .in{display:flex; width:100%; max-width:640px;}
.tab{flex:1; border:0; background:none; padding:9px 4px 10px; font-size:12.5px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border-top:2px solid transparent;}
.tab svg{width:22px; height:22px;}
.tab[aria-selected="true"]{color:var(--accent-text); border-top-color:var(--accent); font-weight:500;}
.view[hidden]{display:none!important;}

/* blocks */
section.block{margin-top:14px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px;}
.card + .card{margin-top:12px;}
.card h2{font-size:15.5px; font-weight:700; margin-bottom:10px;}
.card h2 small{font-weight:400; color:var(--muted); font-size:12.5px; margin-left:6px;}
.section-title{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:18px 0 8px;}
.section-title h2{font-size:15px; font-weight:700;}
.section-title .count{font-size:12.5px; color:var(--muted);}
.hint{font-size:12.5px; color:var(--muted); margin:6px 0 0; line-height:1.55;}

/* forms */
.field{display:flex; flex-direction:column; gap:4px; min-width:0;}
.field > span{font-size:12.5px; color:var(--muted);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.stack{display:flex; flex-direction:column; gap:10px;}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=month],
input[type=datetime-local],input[type=number],select,textarea{
  width:100%; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
  padding:9px 10px; font-size:15px;}
textarea{min-height:64px; resize:vertical;}
.grid3 select,.grid3 input{font-size:13.5px; padding:8px 7px;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:6px 12px; font-size:13.5px; cursor:pointer;}
.chip[aria-pressed="true"]{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-text); font-weight:500;}
.inline{display:flex; gap:8px; align-items:center;}
.inline > input{flex:1;}
.check{display:flex; gap:8px; align-items:flex-start; font-size:14px; cursor:pointer;}
.check input{width:18px; height:18px; margin-top:2px; accent-color:var(--accent); flex:none;}

.btn{border:0; border-radius:6px; padding:10px 14px; font-size:14.5px; font-weight:500; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); display:inline-flex; align-items:center; gap:6px; justify-content:center;
  text-decoration:none; white-space:nowrap;}
.btn.ghost{background:var(--surface-2); color:var(--fg); border:1px solid var(--line);}
.btn.danger{background:var(--danger-wash); color:var(--danger);}
.btn.sm{padding:6px 10px; font-size:13px;}
.btn.wide{width:100%;}
.btn:disabled{opacity:.5; cursor:default;}
.btn svg{width:16px; height:16px;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.linkish{background:none; border:0; padding:2px 0; color:var(--accent-text); font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}

/* line selector */
.linebar{display:flex; align-items:center; gap:10px; margin-top:12px;}
.linebar label{font-size:13px; color:var(--muted); white-space:nowrap;}
.linebar select{flex:1; font-weight:500;}

/* map */
.map-wrap{position:relative; margin-top:10px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--map-bg);}
.map{display:block; width:100%; height:330px; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab;}
.map.picking{cursor:crosshair;}
.map .g-minor{stroke:var(--map-grid); stroke-width:1;}
.map .g-major{stroke:var(--map-grid-strong); stroke-width:1;}
.map .g-label{fill:var(--map-label); font:500 11px var(--font-mono);}
.map .g-zone{fill:var(--map-label); font:600 22px var(--font-mono); opacity:.55;}
.map .road-e,.map .road{fill:none; stroke-linecap:round; stroke-linejoin:round;}
.map .road-e{stroke:var(--road-edge);}
.map .road{stroke:var(--road);}
.map .road-e.road-a{stroke-width:7;} .map .road.road-a{stroke-width:5;}
.map .road-e.road-b{stroke-width:5.5;} .map .road.road-b{stroke-width:3.8;}
.map .road-e.road-c{stroke-width:4;} .map .road.road-c{stroke-width:2.6;}
.map .road.hi{stroke:var(--violet);} .map .road-e.hi{stroke:var(--violet); stroke-opacity:.35; stroke-width:10;}
.map-credit{position:absolute; right:6px; bottom:4px; font-size:10.5px; color:var(--muted); background:var(--map-bg); padding:0 4px; border-radius:3px; opacity:.9; pointer-events:none;}
.map .rlbl{fill:var(--road-label); font:500 11.5px var(--font-body); paint-order:stroke; stroke:var(--map-bg); stroke-width:3px; letter-spacing:.04em;}
.map .seg{fill:none; stroke-width:2.5; stroke-linecap:round;}
.map .seg.t{stroke-width:3.5;}
.map .seg.l{stroke-width:1.5; stroke-dasharray:4 3;}
.map .seg.far{stroke-width:1.8;}
.map .seg.ugh{stroke-width:6; stroke-linecap:butt;} .map .seg-in{fill:none; stroke:var(--map-bg); stroke-linecap:butt;}
.map .seg-in.ugh{stroke-width:2.4;}
.map .seg.ugl{stroke-width:4; stroke-dasharray:7 4; stroke-linecap:butt;} .map .seg-in.ugl{stroke-width:1.4; stroke-dasharray:7 4;}
.map .seg.ugh.far{stroke-width:3.4;} .map .seg-in.ugh.far{stroke-width:1.2;}
.map .pole.ug{stroke:var(--map-bg); stroke-width:2;}
.netkey{display:inline-flex; align-items:center; gap:5px;}
.netkey svg{width:26px; height:10px; flex:none;}
.map .trk{fill:none; stroke:var(--info); stroke-width:2.5; stroke-opacity:.75; stroke-linejoin:round;}
.map .pole{stroke:var(--map-bg); stroke-width:2;}
.map .acc{fill:var(--danger); stroke:var(--map-bg); stroke-width:2;}
.map .acc.done{fill:var(--soft);}
.map .pat{fill:var(--accent); stroke:var(--map-bg); stroke-width:2;}
.map .find{fill:var(--violet); stroke:var(--map-bg); stroke-width:2;}
.map .pick{fill:none; stroke:var(--violet); stroke-width:2.5;}
.map .sel{fill:none; stroke:var(--fg); stroke-width:2;}
.map .g-dist{fill:var(--map-label); font:500 12px var(--font-body); paint-order:stroke; stroke:var(--map-bg); stroke-width:3px; opacity:.9;}
.map .lbl{fill:var(--fg); font:500 11px var(--font-body); paint-order:stroke; stroke:var(--map-bg); stroke-width:3px;}
.map-ctl{position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:6px;}
.map-ctl button{width:36px; height:36px; border-radius:6px; border:1px solid var(--line); background:var(--surface); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.map-ctl button svg{width:18px; height:18px;}
.map-scale{position:absolute; left:10px; bottom:8px; font:500 11px var(--font-mono); color:var(--muted);}
.map-scale i{display:block; height:6px; border:1.5px solid var(--muted); border-top:0; margin-top:2px;}
.map-banner{position:absolute; left:8px; right:52px; top:8px; background:var(--violet); color:#fff; font-size:13px;
  padding:7px 10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
.map-banner button{background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:4px; padding:3px 8px; font-size:12.5px; cursor:pointer;}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin-top:8px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
.map-empty{position:absolute; inset:auto 12px 34px 12px; text-align:center; font-size:12.5px; color:var(--muted); pointer-events:none;}

/* selection / place panel */
.place{margin-top:10px; padding:12px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line);}
.place .head{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.place .kind{font-size:12px; color:var(--muted);}
.place .name{font-weight:700; font-size:15px;}
.place .coords{font:500 12.5px var(--font-mono); color:var(--muted); margin-top:6px;}
.place .row{margin-top:10px;}

/* pole plate — like the enamel tag on a pole */
.plate{display:inline-flex; flex-direction:column; align-items:center; background:var(--plate-bg); color:var(--plate-ink);
  border:1.5px solid var(--plate-ink); border-radius:3px; padding:3px 8px 2px; line-height:1.15; flex:none;
  box-shadow:inset 0 0 0 2px var(--plate-bg), inset 0 0 0 3px rgba(0,0,0,.18);}
.plate b{font:600 14px var(--font-mono); letter-spacing:.06em;}
.plate small{font-size:10px; letter-spacing:.04em;}
.plate.lg b{font-size:20px;}
.plate.lg{padding:6px 12px 4px;}

/* sub tabs (segmented) */
.seg-tabs{display:flex; margin-top:16px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:3px;}
.seg-tabs button{flex:1; border:0; background:none; padding:8px 4px; border-radius:6px; font-size:14px; cursor:pointer; color:var(--muted);}
.seg-tabs button[aria-selected="true"]{background:var(--surface); color:var(--fg); font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.08);}
.seg-tabs .n{font:500 11.5px var(--font-mono); margin-left:3px; color:var(--soft);}

/* collapsible form */
details.form{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-top:12px;}
details.form > summary{list-style:none; cursor:pointer; padding:12px 14px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
details.form > summary::-webkit-details-marker{display:none;}
details.form > summary::after{content:"＋"; color:var(--accent-text); font-weight:400; font-size:18px;}
details.form[open] > summary::after{content:"－";}
details.form > .body{padding:0 14px 14px; display:flex; flex-direction:column; gap:12px;}

/* location picker */
.loc{border:1px dashed var(--line); border-radius:var(--r); padding:10px; display:flex; flex-direction:column; gap:8px;}
.loc .lhead{font-size:12.5px; color:var(--muted);}
.loc .res{display:flex; gap:10px; align-items:center; font-size:12.5px; color:var(--muted); min-height:28px;}
.loc .res.err{color:var(--danger);}
.loc .res.ok{color:var(--fg);}

/* filters */
.filters{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
.filters .foot{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted);}

/* list items */
.item{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-bottom:8px; min-width:0;}
.item.flash{outline:2px solid var(--accent);}
.item .t{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.item .title{font-weight:700; font-size:15px; min-width:0; word-break:break-word;}
.item .meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
.item .body{font-size:14px; margin-top:6px; white-space:pre-wrap; word-break:break-word;}
.item .where{display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap;}
.item .where .c{font:500 12px var(--font-mono); color:var(--muted);}
.item .row{margin-top:10px;}
.item .note{font-size:12px; color:var(--accent-text); margin-top:6px;}
dl.kv{display:grid; grid-template-columns:5.5em 1fr; gap:3px 10px; margin:8px 0 0; font-size:13px;}
dl.kv dt{color:var(--muted);}
dl.kv dd{margin:0; white-space:pre-wrap; word-break:break-word; min-width:0;}
dl.kv dd.overdue{color:var(--danger); font-weight:700;}
.badge{font-size:12px; padding:2px 9px; border-radius:999px; white-space:nowrap; font-weight:500; flex:none;}
.b-open,.b-abnormal{background:var(--danger-wash); color:var(--danger);}
.b-done,.b-normal{background:var(--ok-wash); color:var(--ok);}
.b-pending,.b-material{background:var(--accent-wash); color:var(--accent-text);}
.b-doing{background:var(--info-wash); color:var(--info);}
.b-next{background:var(--violet-wash); color:var(--violet);}
.tag{font-size:11.5px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-left:6px; font-weight:400; white-space:nowrap;}
.empty{text-align:center; color:var(--muted); font-size:13.5px; padding:26px 12px; border:1px dashed var(--line); border-radius:var(--r);}
.day{font-size:13px; color:var(--muted); font-weight:500; margin:16px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--line);}
.chain{font-size:12.5px; color:var(--accent-text); margin-top:8px;}
.chain button{background:none; border:0; color:inherit; padding:0; text-decoration:underline; cursor:pointer; font-size:12.5px;}

/* photos */
.photos{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.photos .ph{width:60px; height:60px; border-radius:5px; border:1px solid var(--line); object-fit:cover; cursor:pointer; background:var(--surface-2);}
.photo-label{font-size:12px; color:var(--muted); margin-top:8px;}
.pending{display:flex; gap:6px; flex-wrap:wrap;}
.pending .w{position:relative;}
.pending img{width:56px; height:56px; object-fit:cover; border-radius:5px; border:1px solid var(--line);}
.pending button{position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; border:0;
  background:var(--danger); color:#fff; font-size:13px; line-height:20px; padding:0; cursor:pointer;}
.file-btn{position:relative; overflow:hidden;}
.file-btn input{position:absolute; inset:0; opacity:0; cursor:pointer;}

/* poles */
.pgroup{margin-bottom:14px;}
.pgroup .gh{display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:6px;}
.pgroup .gh i{width:12px; height:12px; border-radius:50%; display:inline-block;}
.prow{display:grid; grid-template-columns:28px 1fr; gap:4px 8px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:10px; margin-bottom:6px; min-width:0;}
.prow .seq{font:600 12.5px var(--font-mono); color:var(--soft); text-align:right; padding-top:2px;}
.prow .main{min-width:0;}
.prow .pn{font-weight:700;}
.prow .branch{font-size:11.5px; color:var(--accent-text); margin-left:6px; font-weight:500;}
.prow select{margin-top:6px; font-size:13px; padding:6px 8px;}

/* work log */
.open-strip{width:100%; margin-top:14px; text-align:left; background:var(--accent-wash); color:var(--fg);
  border:1px solid var(--accent); border-radius:var(--r); padding:10px 12px; font-size:14px; cursor:pointer;}
.open-strip b{font:600 17px var(--font-mono); color:var(--accent-text); margin:0 2px;}
.follow{display:flex; justify-content:space-between; gap:8px; align-items:center; background:var(--violet-wash);
  color:var(--violet); border-radius:6px; padding:8px 10px; font-size:13px;}
.outage{border-left:3px solid var(--accent); padding-left:10px; display:flex; flex-direction:column; gap:10px;}
.warnbox{font-size:13px; border-radius:6px; padding:8px 10px; background:var(--danger-wash); color:var(--danger); line-height:1.5;}
.warnbox.ok{background:var(--ok-wash); color:var(--ok);}
.accbox{background:var(--info-wash); border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:8px;}
.accbox .h{font-size:13px; color:var(--info); font-weight:700;}

/* stats */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px;}
.stat b{display:block; font:600 26px var(--font-mono);}
.stat span{font-size:12.5px; color:var(--muted);}
.bars .bar{margin-bottom:10px;}
.bars .bl{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; gap:8px;}
.bars .bt{height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; display:flex;}
.bars .bf{height:100%; background:var(--accent);}
.bars .bf.ok{background:var(--ok);} .bars .bf.bad{background:var(--danger);} .bars .bf.mid{background:var(--accent);}

/* overlays */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:60;
  background:var(--fg); color:var(--bg); padding:9px 14px; border-radius:8px; font-size:14px; max-width:min(92vw,520px);
  box-shadow:0 6px 20px rgba(0,0,0,.2);}
.modal{position:fixed; inset:0; z-index:70; background:rgba(10,14,18,.55); display:flex; align-items:flex-end; justify-content:center; padding:16px;}
.modal .sheet{background:var(--surface); color:var(--fg); border-radius:12px; padding:16px; width:100%; max-width:480px; margin-bottom:env(safe-area-inset-bottom,0px);}
.modal .sheet p{margin:0 0 14px; white-space:pre-wrap; line-height:1.6;}
.modal .sheet .row{justify-content:flex-end;}
.modal.photo{align-items:center;}
.modal.photo img{max-width:100%; max-height:80vh; border-radius:6px; background:var(--surface);}
.modal.photo .close{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px;}

/* ---- phone: 16px inputs (no iOS zoom), 44px touch targets, compact header ---- */
input[type=text],input[type=search],input[type=date],input[type=time],input[type=month],
input[type=datetime-local],input[type=number],select,textarea,.grid3 select,.grid3 input,.prow select{font-size:16px;}
.btn,.btn.sm{min-height:44px;}
.btn.sm{padding:8px 12px; font-size:14px;}
.chip{min-height:44px; padding:8px 15px; font-size:15px;}
.seg-tabs button{min-height:44px; font-size:15px;}
.check{min-height:44px; align-items:center; font-size:15px;}
.check input{width:22px; height:22px; margin-top:0;}
.linkish{min-height:44px; display:inline-flex; align-items:center; padding:0 6px; font-size:14px;}
.chain button{display:inline-block; padding:12px 4px; margin:-10px 0;}
.pending button{width:30px; height:30px; line-height:30px; top:-10px; right:-10px; font-size:16px;}
.map-ctl button{width:44px; height:44px;}
.map-ctl button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.top{padding:8px 16px;}
.top h1{font-size:17px;}
.lbl-sm{font-size:13px; color:var(--muted); white-space:nowrap;}
.searchbar{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.searchbar .hint{margin:0;}
.map{height:clamp(220px, 38vh, 330px); touch-action:pan-y; cursor:default;}
.map.unlocked{touch-action:none; cursor:grab;}
.map-wrap.unlocked{outline:2px solid var(--accent); outline-offset:-2px;}
.legend{flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; gap:14px; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.legend i.ln{border-radius:2px; width:14px; height:4px;}
.notice{position:fixed; z-index:45; left:12px; right:12px; bottom:calc(74px + env(safe-area-inset-bottom,0px)); max-width:616px; margin:0 auto;
  display:flex; gap:8px; align-items:center; justify-content:space-between; padding:8px 6px 8px 12px;
  border-radius:var(--r); background:var(--info-wash); color:var(--fg); font-size:13.5px; line-height:1.5;
  border:1px solid var(--line); box-shadow:0 6px 18px rgba(0,0,0,.18);}
.notice[hidden]{display:none;}
.map .g-label{font-size:12px;}
.plate small{font-size:11px;}
.by{white-space:nowrap;}
.sb-row{display:grid; grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto; gap:8px; align-items:center;}
.sb-row select{padding:9px 6px; font-weight:500;}
.sb-row .btn{min-width:56px;}
.searchbar .hint:empty{display:none;}
.notice .linkish{flex:none; white-space:nowrap; min-width:64px; justify-content:center;}
.pgroup .gh{min-height:44px;}
.prow{grid-template-columns:28px 1fr; padding:6px 10px;}
.prow .phead{display:flex; justify-content:space-between; gap:8px; align-items:center; width:100%; min-height:44px;
  background:none; border:0; padding:0; text-align:left; color:inherit; font:inherit; cursor:pointer;}
.prow .sub2{font-size:12.5px; color:var(--muted);}
.prow .more{grid-column:2; padding-bottom:6px;}

/* layers */
.layerbar{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); min-width:0;}
.layerbar span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.layerbar select{width:auto; max-width:46%; flex:none; padding:6px 8px; font-size:16px;}
#layerBtn b{font-family:var(--font-mono); margin-left:2px;}
.modal.layers{align-items:stretch; padding:0;}
.modal.layers .sheet{max-width:640px; margin:auto; height:100%; max-height:100dvh; border-radius:0; display:flex; flex-direction:column; gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px));}
.modal.layers .lh{display:flex; align-items:center; gap:10px;}
.modal.layers .lh b{font-size:17px;}
.modal.layers .lh .hint{flex:1;}
.modal.layers .lbody{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px;}
.modal.layers .lf{display:flex; align-items:center; gap:10px; justify-content:space-between; border-top:1px solid var(--line); padding-top:8px;}
.lsec h3{font-size:13px; color:var(--muted); font-weight:500; margin:12px 0 4px;}
.lrow{display:flex; align-items:center; gap:10px; min-height:44px; border-bottom:1px solid var(--line); cursor:pointer;}
.lrow input{width:22px; height:22px; accent-color:var(--accent); flex:none; margin:0;}
.lrow i.ln{width:18px; height:5px; border-radius:2px; flex:none;}
.lrow .nm{flex:1; font-size:15px;}
.lrow .ct,.ldist .ct{font-size:12.5px; color:var(--muted); margin-left:auto;}
.lrow[hidden],.lsec[hidden],.ldist[hidden]{display:none;}
.ldist > summary{min-height:44px; display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500; border-bottom:1px solid var(--line); list-style:none;}
.ldist > summary::-webkit-details-marker{display:none;}
.ldist > summary::before{content:"▸"; color:var(--muted); font-size:12px;}
.ldist[open] > summary::before{content:"▾";}
.ldist .lrow{padding-left:14px;}
.sb-row{grid-template-columns:auto minmax(0,1fr) auto;}
@media (max-width:520px){ .grid2.dt{grid-template-columns:1fr;} }
@media (max-width:380px){ .grid3{grid-template-columns:1fr 1fr;} .grid3 > :last-child{grid-column:1 / -1;} }
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important;} }

:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}
[hidden]{display:none!important}
/* locator page: the map is the main thing, so it is taller and always draggable */
.lm .map{height:clamp(300px, 54vh, 600px); touch-action:none; cursor:grab;}
.lm .map-wrap.unlocked{outline:none;}
#mapLock{display:none!important;}
#followBtn[aria-pressed="true"]{background:var(--info); color:#fff; border-color:var(--info);}
.lm-panel{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
.lm-panel .place{margin-top:0;}
.trk-stats{font-size:15px; line-height:1.6;}
.trk-stats b{font-family:var(--font-mono); font-size:20px; margin-right:2px;}
.rec-badge{position:absolute; left:10px; top:10px; display:flex; align-items:center; gap:6px; background:var(--danger); color:#fff;
  font-size:13px; font-weight:500; padding:5px 10px; border-radius:999px;}
.rec-badge i{width:9px; height:9px; border-radius:50%; background:#fff; animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.25;}}
@media (prefers-reduced-motion: reduce){ .rec-badge i{animation:none;} }
#recBtn.stop{background:var(--danger); color:#fff;}
.map .me-acc{fill:#1a73e8; fill-opacity:.14; stroke:#1a73e8; stroke-opacity:.45; stroke-width:1;}
.map .me-dot{fill:#1a73e8; stroke:#ffffff; stroke-width:3;}
.map .me-head{fill:#1a73e8; fill-opacity:.45;}
.map .near-ln{fill:none; stroke:var(--fg); stroke-width:1.5; stroke-dasharray:5 4; opacity:.55;}
.map .near-ring{fill:none; stroke:var(--fg); stroke-width:2;}
.map .trk.live{stroke:var(--danger); stroke-width:3.5; stroke-opacity:.9;}
.rec-warn{font-size:13px; border-radius:6px; padding:8px 10px; background:var(--info-wash); color:var(--info); line-height:1.5; margin-top:8px;}
.trk-item{display:flex; flex-direction:column; gap:8px;}
.trk-item .meta{font-size:13px; color:var(--muted);}
#trkGap{margin-top:8px;}

<div class="app lm">
  <header class="top">
    <h1>線路定位地圖</h1>
    <span class="store-chip" id="gpsChip">定位未開啟</span>
  </header>

  <div class="searchbar">
    <div class="sb-row">
      <button class="btn ghost" type="button" id="layerBtn" aria-label="選擇圖層">圖層</button>
      <input type="search" id="q" placeholder="民一43、B0721HD63 或路名" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="找電桿或路名">
      <button class="btn" id="qGo" type="button">找</button>
    </div>
    <p class="hint" id="qMsg" aria-live="polite"></p>
    <div class="layerbar"><span id="layerSum"></span></div>
  </div>

  <div class="map-wrap" id="mapWrap">

    <div class="map-banner" id="pickBanner" hidden><span></span><button id="pickCancel" type="button">取消</button></div>
    <div class="map-ctl">
      <button type="button" id="mapLock" hidden aria-label="拖曳地圖"></button>
      <button type="button" id="followBtn" aria-pressed="true" aria-label="跟著我的位置" title="跟著我的位置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button type="button" id="zoomIn" aria-label="放大">＋</button>
      <button type="button" id="zoomOut" aria-label="縮小">－</button>
      <button type="button" id="zoomFit" aria-label="顯示全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="map-scale" id="mapScale"></div>
    <div class="map-empty" id="mapEmpty" hidden></div>
    <div class="map-credit" id="mapCredit" hidden>© OpenStreetMap 貢獻者</div>
    <div class="rec-badge" id="recBadge" hidden><i></i><span id="recBadgeText">記錄中</span></div>
  </div>
  <p class="hint" id="mapOutside" hidden></p>
  <div class="legend" id="legend"></div>

  <section class="lm-panel">
    <div class="card" id="gpsStart">
      <h2>開始定位</h2>
      <p class="hint" style="margin:0 0 10px">按下後 iPhone 會問「是否允許取用位置」,請選「允許」。地圖會顯示你的藍點,並告訴你最近的是哪一支桿。</p>
      <button class="btn wide" type="button" id="gpsGo">開始定位</button>
    </div>
    <div class="warnbox" id="gpsErr" hidden></div>

    <div class="place" id="meCard" hidden>
      <div class="head"><div><div class="kind">我的位置</div><div class="name num" id="meText"></div><div class="kind" id="meSub"></div></div><span class="plate" id="mePlate"></span></div>
      <div class="row" id="meBtns"></div>
    </div>

    <div class="place" id="nearCard" hidden>
      <div class="head"><div><div class="kind">離我最近的電桿</div><div class="name" id="nearName"></div><div class="kind" id="nearSub"></div></div><span id="nearPlate"></span></div>
      <div class="row" id="nearBtns"></div>
    </div>

    <div id="placePanel"></div>

    <div class="card" id="trkCard">
      <h2>行車軌跡</h2>
      <div class="trk-stats num" id="trkStats">還沒開始記錄。</div>
      <div class="rec-warn" id="trkKeep" hidden></div>
      <div class="warnbox" id="trkGap" hidden></div>
      <div class="row" style="margin-top:10px">
        <button class="btn wide" type="button" id="recBtn">開始記錄軌跡</button>
      </div>
      <p class="hint">記錄時請保持這個畫面開著、螢幕不要鎖。收工後按「匯出 GPX」,再到紀錄網頁的「巡修」附上這個檔案。</p>
    </div>

    <div class="section-title"><h2>已存的軌跡</h2><span class="count" id="trkCount"></span></div>
    <div id="trkList"></div>

    <a class="btn ghost wide" id="recordsLink" target="_blank" rel="noopener" style="margin-top:14px">到「線路巡視紀錄」寫事故、巡修、日誌</a>
    <p class="hint" style="text-align:center" id="appVer">版本 v4(10/22):加入所有分線(共 997 條線)</p>

// Taipower grid coordinate (電力座標) <-> WGS84.
// Rules: OSGeo wiki "Taiwan Power Company grid", 上河文化 電力座標解讀,
// zone table as used by public conversion scripts.
// Taiwan & Penghu: grid is TWD67 TM2; TWD97 ≈ TWD67 + (828, -207) m; TWD97 ≈ WGS84.
// Kinmen & Mazu: TM on the International ellipsoid with a 3-parameter shift.
const TPC = (function(){
  const ZONES = {
    A:[170000,2750000], B:[250000,2750000], C:[330000,2750000],
    D:[170000,2700000], E:[250000,2700000], F:[330000,2700000],
    G:[170000,2650000], H:[250000,2650000],
    J:[90000,2600000],  K:[170000,2600000], L:[250000,2600000],
    M:[90000,2550000],  N:[170000,2550000], O:[250000,2550000],
    P:[90000,2500000],  Q:[170000,2500000], R:[250000,2500000],
    T:[170000,2450000], U:[250000,2450000],
    V:[170000,2400000], W:[250000,2400000],
    X:[275000,2614000], Y:[275000,2564000],   // Penghu
    Z:[90000,2675800],                        // Kinmen
    S:[10000,2894000]                         // Mazu
  };
  const GRS80 = {a:6378137, f:1/298.257222101};
  const INTL  = {a:6378388, f:1/297};
  const WGS84 = {a:6378137, f:1/298.257223563};

  // ---- Transverse Mercator (Snyder) ----
  function tmFwd(lat, lon, p){
    const {a,f} = p.ell, k0 = p.k0, e2 = f*(2-f), ep2 = e2/(1-e2);
    const phi = lat*Math.PI/180, lam = (lon-p.lon0)*Math.PI/180;
    const N = a/Math.sqrt(1-e2*Math.sin(phi)**2), T = Math.tan(phi)**2, C = ep2*Math.cos(phi)**2;
    const A = lam*Math.cos(phi), M = meridian(phi, a, e2);
    const x = k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);
    const y = k0*(M+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
    return [x+p.x0, y+p.y0];
  }
  function meridian(phi, a, e2){
    return a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*phi-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*phi)
      +(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*phi)-(35*e2**3/3072)*Math.sin(6*phi));
  }
  function tmInv(X, Y, p){
    const {a,f} = p.ell, k0 = p.k0, e2 = f*(2-f), ep2 = e2/(1-e2);
    const x = X-p.x0, y = Y-p.y0;
    const M = y/k0, mu = M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256));
    const e1 = (1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
    const phi1 = mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)
      +(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
    const C1 = ep2*Math.cos(phi1)**2, T1 = Math.tan(phi1)**2;
    const N1 = a/Math.sqrt(1-e2*Math.sin(phi1)**2), R1 = a*(1-e2)/Math.pow(1-e2*Math.sin(phi1)**2,1.5);
    const D = x/(N1*k0);
    const phi = phi1-(N1*Math.tan(phi1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24
      +(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
    const lam = (D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(phi1);
    return [phi*180/Math.PI, p.lon0+lam*180/Math.PI];
  }
  // ---- 3-parameter datum shift via ECEF ----
  function toEcef(lat, lon, ell){
    const e2 = ell.f*(2-ell.f), phi = lat*Math.PI/180, lam = lon*Math.PI/180;
    const N = ell.a/Math.sqrt(1-e2*Math.sin(phi)**2);
    return [N*Math.cos(phi)*Math.cos(lam), N*Math.cos(phi)*Math.sin(lam), N*(1-e2)*Math.sin(phi)];
  }
  function fromEcef(X, Y, Z, ell){
    const e2 = ell.f*(2-ell.f), lon = Math.atan2(Y, X), p = Math.hypot(X, Y);
    let lat = Math.atan2(Z, p*(1-e2));
    for(let i=0;i<8;i++){ const N = ell.a/Math.sqrt(1-e2*Math.sin(lat)**2); lat = Math.atan2(Z+e2*N*Math.sin(lat), p); }
    return [lat*180/Math.PI, lon*180/Math.PI];
  }
  function shift(lat, lon, from, to, d){
    const [x,y,z] = toEcef(lat, lon, from);
    return fromEcef(x+d[0], y+d[1], z+d[2], to);
  }
  const ISLAND = {
    Z:{ell:INTL, k0:0.9996, lon0:117, x0:-42160, y0:-205, d:[-637,-549,-203]},
    S:{ell:INTL, k0:0.9996, lon0:117, x0:-279825, y0:20830, d:[-637,-549,-203]}
  };
  function mainParams(letter){ return {ell:GRS80, k0:0.9999, lon0:(letter==='X'||letter==='Y')?119:121, x0:250000, y0:0}; }

  // ---- parse / format the code on the pole plate ----
  function normalize(s){
    return String(s||'').toUpperCase().replace(/[\s\-_.,，、]/g,'').replace(/[Ａ-Ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  }
  function parse(s){
    const t = normalize(s);
    const m = t.match(/^([A-HJ-Z])(\d{2})(\d{2})([A-H])([A-E])(\d)(\d)(?:(\d)(\d))?$/);
    if(!m) return null;
    if(!ZONES[m[1]]) return null;
    return {zone:m[1], pp:+m[2], qq:+m[3], r:m[4].charCodeAt(0)-65, s:m[5].charCodeAt(0)-65,
            t:+m[6], u:+m[7], v:m[8]!=null?+m[8]:null, w:m[9]!=null?+m[9]:null};
  }
  function gridXY(c){
    const [bx, by] = ZONES[c.zone];
    const v = c.v==null ? 5 : c.v, w = c.w==null ? 5 : c.w;   // centre of the 10 m cell when no metre digits
    return [bx+800*c.pp+100*c.r+10*c.t+v, by+500*c.qq+100*c.s+10*c.u+w];
  }
  function toLatLng(code){
    const c = typeof code==='string' ? parse(code) : code;
    if(!c) return null;
    const [gx, gy] = gridXY(c);
    if(ISLAND[c.zone]){
      const p = ISLAND[c.zone];
      const [la, lo] = tmInv(gx, gy, p);
      const [lat, lng] = shift(la, lo, p.ell, WGS84, p.d);
      return {lat, lng, gx, gy, zone:c.zone, precision: c.v==null ? 10 : 1};
    }
    const [lat, lng] = tmInv(gx+828, gy-207, mainParams(c.zone));
    return {lat, lng, gx, gy, zone:c.zone, precision: c.v==null ? 10 : 1};
  }
  function fmt(zone, gx, gy){
    const [bx, by] = ZONES[zone];
    const dx = Math.floor(gx-bx), dy = Math.floor(gy-by);
    if(dx<0 || dy<0 || dx>=80000 || dy>=50000) return null;
    const pp = Math.floor(dx/800), r = Math.floor((dx%800)/100), t = Math.floor((dx%100)/10), v = dx%10;
    const qq = Math.floor(dy/500), s = Math.floor((dy%500)/100), u = Math.floor((dy%100)/10), w = dy%10;
    const two = n=>String(n).padStart(2,'0');
    return {short: zone+two(pp)+two(qq)+' '+String.fromCharCode(65+r)+String.fromCharCode(65+s)+t+u,
            full: zone+two(pp)+two(qq)+' '+String.fromCharCode(65+r)+String.fromCharCode(65+s)+t+u+v+w};
  }
  function fromLatLng(lat, lng){
    if(!(lat>21 && lat<27 && lng>117 && lng<123)) return null;
    if(lng < 118.6 && lat > 24.2 && lat < 24.7){           // Kinmen
      const p = ISLAND.Z; const [la, lo] = shift(lat, lng, WGS84, p.ell, p.d.map(x=>-x));
      const [gx, gy] = tmFwd(la, lo, p); return fmt('Z', gx, gy);
    }
    if(lat > 25.9 && lng < 120.6){                          // Mazu
      const p = ISLAND.S; const [la, lo] = shift(lat, lng, WGS84, p.ell, p.d.map(x=>-x));
      const [gx, gy] = tmFwd(la, lo, p); return fmt('S', gx, gy);
    }
    const penghu = lng < 119.8;
    const [x97, y97] = tmFwd(lat, lng, mainParams(penghu ? 'X' : 'G'));
    const gx = x97-828, gy = y97+207;
    const order = penghu ? ['X','Y'] : ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R','T','U','V','W'];
    for(const z of order){ const f = fmt(z, gx, gy); if(f) return f; }
    return null;
  }
  // TWD97 TM2 plane coordinates, used as the map's drawing plane
  function toPlane(lat, lng){ return tmFwd(lat, lng, mainParams('G')); }
  function fromPlane(x, y){ const [lat, lng] = tmInv(x, y, mainParams('G')); return {lat, lng}; }
  // corner of a grid block in the drawing plane (for the background grid)
  function gridToPlane(gx, gy){ return [gx+828, gy-207]; }
  function planeToGrid(x, y){ return [x-828, y+207]; }
  function zoneAt(gx, gy){
    for(const z of ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R','T','U','V','W']){
      const [bx, by] = ZONES[z];
      if(gx>=bx && gx<bx+80000 && gy>=by && gy<by+50000) return z;
    }
    return null;
  }
  return {parse, normalize, toLatLng, fromLatLng, toPlane, fromPlane, gridToPlane, planeToGrid, zoneAt, ZONES};
})();

// ---------- small helpers ----------
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
function nowLocal(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
const today = () => nowLocal().slice(0, 10);
const nowTime = () => nowLocal().slice(11, 16);
const fmtDT = v => v ? v.replace('T', ' ') : '—';
const isThisMonth = s => !!s && s.slice(0, 7) === today().slice(0, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const WEEK = ['日','一','二','三','四','五','六'];
function matchQ(q, fields){
  if(!q) return true;
  const hay = fields.map(f => String(f || '')).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
// fixed, clearly different colours per line (in line-list order), readable on light and dark maps
const LINE_PALETTE = ['#16a34a', '#d4237a', '#0891b2', '#b7791f', '#4f46e5', '#dc4c1a', '#0d9488', '#7c3aed', '#475569', '#65a30d'];
let lineColorMap = {};
function refreshLineColors(){ lineColorMap = {}; Array.from(LAYERS).forEach((n, i) => { lineColorMap[n] = LINE_PALETTE[i % LINE_PALETTE.length]; }); }
function lineColor(line){ const m = typeof LINE_META !== 'undefined' && LINE_META.get(line); return m ? m.color : (lineColorMap[line] || '#64748b'); }
function hasLoc(o){ return o && typeof o.lat === 'number' && typeof o.lng === 'number' && isFinite(o.lat) && isFinite(o.lng); }
function codeFor(o){
  if(!hasLoc(o)) return '';
  if(o.tpc) return o.tpc;
  const f = TPC.fromLatLng(o.lat, o.lng);
  return f ? f.short : '';
}

// Everything is kept per person under data/users/<id>/app/... in the artifact's
// database, so each person only sees their own records. Photos are separate
// documents so a record never grows past the size limit.
const KINDS = ['accidents', 'patrols', 'poles', 'tracks', 'worklogs'];
const S = { accidents:[], patrols:[], poles:[], tracks:[], worklogs:[], poleDocs:[], polesets:[], basesets:[], byLine:new Map(), poleById:new Map(), settings:{ types:['LCO','CO','設備損壞'], lines:[] } };
// Poles come from two places: single records (poles you mark yourself) and bundles
// holding a whole line (imported from Taipower's open data). S.poles merges both.
function packPole(p){ const o = { i: p.id, n: p.poleNo || '', la: p.lat, lo: p.lng, c: p.tpc || '', p: p.prev || null, o: p.order || 0, k: p.kind || '', f: p.form || '' }; if(p.net) o.g = p.net; return o; }
// 架空/地下 × 高壓/低壓. Open data is all overhead: a 低 in the pole number means low voltage.
const NET_LABEL = { oh: '架空高壓', ohl: '架空低壓', ugh: '地下高壓', ugl: '地下低壓' };
function netOf(p){ return p.net || (p.kind === 'l' ? 'ohl' : 'oh'); }
function shortLine(n){ return String(n || '').replace(/(幹線|幹|分線|線)$/, '') || n; }
// Base sets come from the open-data layer files; a set saved in the database (an edited
// or imported line) replaces the base set of the same line.
const expCache = new WeakMap();
function expandSet(set){
  let ex = expCache.get(set);
  if(!ex){
    ex = (set.poles || []).map(q => ({ id: q.i, line: set.line, poleNo: q.n, lat: q.la, lng: q.lo, tpc: q.c || '',
      prev: q.p || null, order: q.o || 0, kind: q.k || '', form: q.f || '', net: q.g || '', pack: set.id, _p: q.x != null ? [q.x, q.y] : null }));
    expCache.set(set, ex);
  }
  return ex;
}
function rebuildPoles(){
  const dbLines = new Set(S.polesets.map(s => s.line));
  const out = S.poleDocs.map(d => Object.assign({}, d));
  S.polesets.forEach(s => { for(const p of expandSet(s)) out.push(p); });
  S.basesets.forEach(s => { if(!dbLines.has(s.line)) for(const p of expandSet(s)) out.push(p); });
  const byId = new Map(); out.forEach(p => byId.set(p.id, p));
  const byLine = new Map();
  out.forEach(p => {
    p._prev = p.prev ? byId.get(p.prev) || null : null;
    if(!p._p && hasLoc(p)) p._p = TPC.toPlane(p.lat, p.lng);
    let a = byLine.get(p.line); if(!a) byLine.set(p.line, a = []); a.push(p);
  });
  S.byLine = byLine; S.poleById = byId;
  S.poles = out;
}

// a line saved to the database: plain fields only (a base set carries plane x/y for speed)
function cleanSet(set){
  return { id: set.id, line: set.line, source: set.source || (set.base ? '台電開放資料「台灣電力公司桃園市電桿坐標及桿號」' : ''), importedAt: set.importedAt || today(),
    poles: set.poles.map(q => { const o = { i: q.i, n: q.n, la: q.la, lo: q.lo, c: q.c || '', p: q.p || null, o: q.o || 0, k: q.k || '', f: q.f || '' }; if(q.g) o.g = q.g; return o; }) };
}
// poles you add yourself should be visible right away
function showLayerOf(line){ if(line && typeof LAYERS !== 'undefined' && !LAYERS.has(line)){ LAYERS.add(line); saveLayers(); refreshLineColors(); } }
const Store = {
  mode: 'loading', base: null, photoCache: new Map(),
  async init(onChange){
    let db = null, user = null, id = null;
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      }
    }catch(e){}
    if(db && user){ try{ id = await user.id(); }catch(e){} }
    if(db && id){
      // one shared area for the whole team; each record remembers who wrote it
      this.mode = 'db'; this.uid = id; this.user = user;
      this.base = db.doc('shared/app');
      return new Promise(resolve => {
        let pending = KINDS.length + 2;
        const done = () => { if(--pending === 0) resolve(); };
        KINDS.forEach(k => {
          let first = true;
          this.base.collection(k).onSnapshot(snap => {
            const docs = snap.docs.filter(d => d.exists).map(d => d.data());
            if(k === 'poles'){ S.poleDocs = docs; rebuildPoles(); } else S[k] = docs;
            onChange(k);
            if(first){ first = false; done(); }
          }, err => { this.fail(err); if(first){ first = false; done(); } });
        });
        let firstSet = true;
        this.base.collection('polesets').onSnapshot(snap => {
          S.polesets = snap.docs.filter(d => d.exists).map(d => d.data()); rebuildPoles(); onChange('poles');
          if(firstSet){ firstSet = false; done(); }
        }, err => { this.fail(err); if(firstSet){ firstSet = false; done(); } });
        let first = true;
        this.base.onSnapshot(doc => {
          const d = doc.exists ? doc.data() : null;
          if(d && Array.isArray(d.types) && d.types.length) S.settings.types = d.types.slice();
          if(d && Array.isArray(d.lines)) S.settings.lines = d.lines.slice();
          onChange('settings');
          if(first){ first = false; done(); }
        }, () => { if(first){ first = false; done(); } });
        setTimeout(() => { if(pending > 0){ pending = 1; done(); } }, 9000);
      });
    }
    try{ localStorage.setItem('lp:t', '1'); localStorage.removeItem('lp:t'); this.mode = 'local'; }catch(e){ this.mode = 'memory'; }
    if(this.mode === 'local'){
      KINDS.forEach(k => { try{ S[k === 'poles' ? 'poleDocs' : k] = JSON.parse(localStorage.getItem('lp:' + k) || '[]'); }catch(e){} });
      try{ S.polesets = JSON.parse(localStorage.getItem('lp:polesets') || '[]'); }catch(e){}
      rebuildPoles();
      try{ const st = JSON.parse(localStorage.getItem('lp:settings') || 'null'); if(st && st.types) S.settings.types = st.types; if(st && st.lines) S.settings.lines = st.lines; }catch(e){}
    }
  },
  saveLocal(arr){
    if(this.mode !== 'local') return true;
    const key = arr === 'poleDocs' ? 'poles' : arr;
    try{ localStorage.setItem('lp:' + key, JSON.stringify(arr === 'settings' ? S.settings : S[arr])); return true; }
    catch(e){ toast('這台裝置的儲存空間滿了,請刪除一些照片或舊紀錄'); return false; }
  },
  // write one document of collection `coll`, mirrored in S[arr]
  async write(coll, arr, obj, isDel){
    if(coll === 'polesets' && !isDel) showLayerOf(obj.line);
    if(!isDel && coll !== 'polesets' && this.uid && !obj.by) obj = Object.assign({}, obj, { by: this.uid });
    const prev = S[arr];
    S[arr] = isDel ? prev.filter(x => x.id !== obj.id)
      : (prev.some(x => x.id === obj.id) ? prev.map(x => x.id === obj.id ? obj : x) : [obj].concat(prev));
    const poles = arr === 'poleDocs' || arr === 'polesets';
    if(poles) rebuildPoles();
    let ok = true;
    if(this.mode === 'db'){
      try{ const ref = this.base.collection(coll).doc(obj.id); if(isDel) await ref.delete(); else await ref.set(obj); }
      catch(e){ this.fail(e); ok = false; }
    } else ok = this.saveLocal(arr);
    if(!ok){ S[arr] = prev; if(poles) rebuildPoles(); }
    scheduleRender();
    return ok;
  },
  put(kind, obj){
    if(kind !== 'poles') return this.write(kind, kind, obj, false);
    showLayerOf(obj.line);
    if(obj.pack){
      const set = S.polesets.find(x => x.id === obj.pack) || S.basesets.find(x => x.id === obj.pack); if(!set) return Promise.resolve(false);
      const ns = cleanSet(set), c = packPole(obj), i = ns.poles.findIndex(q => q.i === obj.id);
      if(i >= 0) ns.poles[i] = c; else ns.poles.push(c);
      return this.write('polesets', 'polesets', ns, false);
    }
    const d = clone(obj); delete d.pack;
    return this.write('poles', 'poleDocs', d, false);
  },
  del(kind, id){
    if(kind !== 'poles') return this.write(kind, kind, { id }, true);
    const p = S.poles.find(x => x.id === id);
    if(p && p.pack){
      const set = S.polesets.find(x => x.id === p.pack) || S.basesets.find(x => x.id === p.pack); if(!set) return Promise.resolve(false);
      const ns = cleanSet(set); ns.poles = ns.poles.filter(q => q.i !== id);
      return this.write('polesets', 'polesets', ns, false);
    }
    return this.write('poles', 'poleDocs', { id }, true);
  },
  async putSettings(){
    if(this.mode === 'db'){ try{ await this.base.set({ types: S.settings.types, lines: S.settings.lines }); }catch(e){ this.fail(e); return false; } return true; }
    return this.saveLocal('settings');
  },
  async putPhoto(dataUrl){
    const id = 'ph' + uid();
    if(this.mode === 'db'){
      try{ await this.base.collection('photos').doc(id).set({ data: dataUrl, at: Date.now() }); }
      catch(e){ this.fail(e); return null; }
    } else if(this.mode === 'local'){
      try{ localStorage.setItem('lp:photo:' + id, dataUrl); }
      catch(e){ toast('這台裝置的儲存空間滿了,照片沒有存進去'); return null; }
    }
    this.photoCache.set(id, dataUrl);
    return id;
  },
  async getPhoto(id){
    if(this.photoCache.has(id)) return this.photoCache.get(id);
    let src = null;
    if(this.mode === 'db'){
      try{ const d = await this.base.collection('photos').doc(id).get(); if(d.exists) src = d.data().data; }catch(e){}
    } else if(this.mode === 'local'){
      try{ src = localStorage.getItem('lp:photo:' + id); }catch(e){}
    }
    if(src) this.photoCache.set(id, src);
    return src;
  },
  async dropPhotos(ids){
    for(const id of ids || []){
      if(photoInUse(id)) continue;
      this.photoCache.delete(id);
      if(this.mode === 'db'){ try{ await this.base.collection('photos').doc(id).delete(); }catch(e){} }
      else if(this.mode === 'local'){ try{ localStorage.removeItem('lp:photo:' + id); }catch(e){} }
    }
  },
  fail(e){
    const code = e && e.code;
    const msg = {
      quota_exceeded: '儲存空間已滿,請刪除一些照片或舊紀錄後再試',
      resource_exhausted: '操作太快了,請稍等幾秒再試',
      invalid_argument: '這筆資料無法儲存(可能照片太大),請減少照片後再試',
      revoked: '目前沒有權限儲存資料',
      not_granted: '目前沒有權限儲存資料',
    }[code] || '儲存失敗,請確認網路連線後再試';
    toast(msg);
  }
};
function photoInUse(id){
  return S.accidents.some(a => (a.before || []).includes(id) || (a.after || []).includes(id))
      || S.worklogs.some(w => (w.photos || []).includes(id));
}
function allLines(){
  const s = new Set();
  KINDS.forEach(k => { if(k !== 'poles') S[k].forEach(o => { if(o.line) s.add(o.line); }); });
  S.poleDocs.forEach(o => { if(o.line) s.add(o.line); });
  S.polesets.forEach(o => { if(o.line) s.add(o.line); });
  if(typeof LINE_META !== 'undefined') LINE_META.forEach((v, n) => s.add(n));
  const preset = (S.settings.lines || []).filter(Boolean);
  return preset.concat(Array.from(s).filter(n => !preset.includes(n)).sort((a, b) => a.localeCompare(b, 'zh-Hant')));
}
function findPole(line, no){
  if(!no) return null;
  let n = String(no).trim().replace(/＃/g, '#');
  // accept "43", "#43" or "民一幹#43"
  const at = n.indexOf('#');
  if(at > 0){ const l = n.slice(0, at); if(!line) line = l; n = n.slice(at); }
  const tries = n.startsWith('#') ? [n] : [n, '#' + n];
  const pool = line ? (S.byLine.get(line) || []) : S.poles;
  for(const t of tries){ const hit = pool.find(p => p.poleNo === t); if(hit) return hit; }
  return null;
}

// who wrote a record: only the id is stored, the name is looked up when shown
function byHtml(o){ return o && o.by ? '<span class="by" data-uid="' + esc(o.by) + '">…</span>' : ''; }

// ---------- render scheduling ----------
let renderTimer = null;
function scheduleRender(){
  if(renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; renderAll(); }, 0);
}

// ---------- 圖層:每條幹線一層,開了才下載 ----------
// LINE_INDEX_DATA (built into the page) lists every line: [name, poles, district, bbox(TWD97), file].
// Pole files are fetched only for layers that are on, or near where you are looking.
const LINE_META = new Map();
// every trunk line keeps one colour; lines within 150 m of each other never share one (set when the data is built)
const LINE_COLORS = ['#e6194b','#f58231','#d4a017','#8a9a00','#3cb44b','#127a3d','#0aa3a3','#2fa4e7','#4363d8','#6a4cff',
  '#911eb4','#e83fd1','#ff7aa8','#9a6324','#a3324f','#6b7280','#6aae00','#c39bff','#f0714f','#17b088'];
let LINE_FILES = [], LINE_FORMS = [];
const chunkLoads = new Map();
let LAYERS = new Set();
let layerStoreKey = 'lp:layers';
let layerPromptDone = false;
function initLineIndex(ix, storeKey, defaults){
  layerStoreKey = storeKey;
  LINE_FILES = ix.files || []; LINE_FORMS = ix.forms || [];
  (ix.lines || []).forEach(([name, n, dist, bb, file, c], li) => LINE_META.set(name, { name, n, dist, bb, file, li, color: LINE_COLORS[(c || 0) % LINE_COLORS.length] }));
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(storeKey) || 'null'); }catch(e){}
  LAYERS = new Set(Array.isArray(saved) ? saved : (defaults || []));
  return Array.isArray(saved);
}
function saveLayers(){ try{ localStorage.setItem(layerStoreKey, JSON.stringify(Array.from(LAYERS))); }catch(e){} }
function lineShown(line){ return LAYERS.has(line) && (!curLine || line === curLine); }
function shownLines(){ return Array.from(LAYERS).filter(l => !curLine || l === curLine); }

// stable id from the line's name, so ids don't shift when lines are added to the data
function lineId(name){ let a = 0, b = 0; for(const ch of name){ const c = ch.codePointAt(0); a = (Math.imul(a, 31) + c) >>> 0; b = (Math.imul(b, 131) + c) >>> 0; } return 'L' + a.toString(36) + b.toString(36); }
function unpackLine(l){
  const id = lineId(l.name);
  const poles = l.poles.map((q, i) => {
    const ll = TPC.fromPlane(q[1], q[2]);
    return { i: id + '-' + i, n: q[0], la: +ll.lat.toFixed(7), lo: +ll.lng.toFixed(7), c: q[3] ? q[3].replace(/^(\w{5})(\w+)$/, '$1 $2') : '', p: q[4] >= 0 ? id + '-' + q[4] : null,
      o: i, k: q[5], f: LINE_FORMS[q[6]] || '', x: q[1], y: q[2] };
  });
  return { id, line: l.name, base: true, poles };
}
function loadChunk(fi){
  if(!chunkLoads.has(fi)){
    const p = fetch(LINE_FILES[fi]).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
      j.lines.forEach(l => { if(!S.basesets.some(s => s.line === l.name)) S.basesets.push(unpackLine(l)); });
      rebuildPoles();
      if(typeof onLinesLoaded === 'function') onLinesLoaded();
    }).catch(err => { chunkLoads.delete(fi); toast('電桿資料下載失敗,請確認網路後再試'); throw err; });
    chunkLoads.set(fi, p);
  }
  return chunkLoads.get(fi);
}
function lineLoaded(line){ const m = LINE_META.get(line); return !m || chunkLoads.has(m.file) || S.polesets.some(s => s.line === line); }
async function ensureLines(lines){
  const files = new Set();
  lines.forEach(n => { const m = LINE_META.get(n); if(m && !S.polesets.some(s => s.line === n)) files.add(m.file); });
  try{ await Promise.all(Array.from(files).map(loadChunk)); }catch(e){}
}
// load every line passing within `m` metres of a point (for "nearest pole" and 電力座標 lookups)
function linesNear(ll, m){
  const [x, y] = TPC.toPlane(ll.lat, ll.lng), out = [];
  LINE_META.forEach(l => { const b = l.bb; if(x >= b[0] - m && x <= b[2] + m && y >= b[1] - m && y <= b[3] + m) out.push(l.name); });
  return out;
}
async function ensureNear(ll, m){ await ensureLines(linesNear(ll, m || 500)); }

// ---------- 圖層選單 ----------
function layerSummary(){
  const on = Array.from(LAYERS);
  return on.length ? on.slice(0, 3).join('、') + (on.length > 3 ? ' 等 ' + on.length + ' 條' : '') : '還沒開任何圖層';
}
function renderLayerBar(){
  const b = $('layerBtn'); if(!b) return;
  b.innerHTML = '圖層 <b class="num">' + LAYERS.size + '</b>';
  const s = $('layerSum'); if(s) s.textContent = layerSummary();
}
function setLayer(name, on){
  if(on) LAYERS.add(name); else LAYERS.delete(name);
  saveLayers(); refreshLineColors(); renderLayerBar();
  if(on) ensureLines([name]).then(() => { if(typeof onLayersChanged === 'function') onLayersChanged(); });
  if(typeof onLayersChanged === 'function') onLayersChanged();
}
function openLayerSheet(){
  const ov = $('overlay');
  const near = (() => {
    const [cx, cy] = [LMap.cx, LMap.cy], w = LMap.W * LMap.mpp / 2, h = LMap.H * LMap.mpp / 2;
    const out = [];
    LINE_META.forEach(l => { const b = l.bb; if(b[0] <= cx + w && b[2] >= cx - w && b[1] <= cy + h && b[3] >= cy - h) out.push(l); });
    return out.sort((a, b) => b.n - a.n).slice(0, 25);
  })();
  const byDist = new Map();
  LINE_META.forEach(l => { if(!byDist.has(l.dist)) byDist.set(l.dist, []); byDist.get(l.dist).push(l); });
  const row = l => '<label class="lrow" data-name="' + esc(l.name) + '"><input type="checkbox" data-layer="' + esc(l.name) + '"' + (LAYERS.has(l.name) ? ' checked' : '') + '>'
    + '<i class="ln" style="background:' + lineColor(l.name) + '"></i><span class="nm">' + esc(l.name) + '</span><span class="ct num">' + l.n + ' 支</span></label>';
  const others = Array.from(LAYERS).filter(n => !LINE_META.has(n)).map(n => ({ name: n, n: S.poles.filter(p => p.line === n).length, dist: '' }));
  ov.innerHTML = '<div class="modal layers" role="dialog" aria-modal="true" aria-label="選擇圖層"><div class="sheet">'
    + '<div class="lh"><b>選擇圖層</b><span class="hint" style="margin:0" id="lyCount"></span><button class="btn sm" type="button" data-a="done">完成</button></div>'
    + '<input type="search" id="lyQ" placeholder="搜尋幹線名稱,例如 民族" autocomplete="off" aria-label="搜尋幹線">'
    + '<div class="lbody">'
    + '<div class="lsec" id="lyOn"><h3>已開啟</h3>' + (LAYERS.size ? Array.from(LAYERS).map(n => row(LINE_META.get(n) || others.find(o => o.name === n))).join('') : '<p class="hint">還沒開任何圖層。</p>') + '</div>'
    + (near.length ? '<div class="lsec"><h3>目前地圖範圍內</h3>' + near.map(row).join('') + '</div>' : '')
    + '<div class="lsec"><h3>全部幹線(依行政區)</h3>' + Array.from(byDist.keys()).sort((a, b) => a.localeCompare(b, 'zh-Hant')).map(d => {
        const ls = byDist.get(d).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
        return '<details class="ldist"><summary>' + esc(d) + '<span class="ct">' + ls.length + ' 條</span></summary>' + ls.map(row).join('') + '</details>';
      }).join('') + '</div>'
    + '<p class="hint" id="lyNone" hidden>找不到這個名稱的幹線。</p></div>'
    + '<div class="lf"><button class="btn ghost sm" type="button" data-a="clear">全部關閉</button><span class="hint" style="margin:0">同時開 15 條以上會比較慢</span></div>'
    + '</div></div>';
  const m = ov.firstChild;
  const count = () => { $('lyCount').textContent = '已開 ' + LAYERS.size + ' 條'; };
  count();
  const close = () => { ov.innerHTML = ''; document.removeEventListener('keydown', key); };
  const key = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  m.addEventListener('click', e => {
    if(e.target === m) return close();
    const a = e.target.closest('[data-a]'); if(!a) return;
    if(a.dataset.a === 'done') close();
    if(a.dataset.a === 'clear'){ Array.from(LAYERS).forEach(n => LAYERS.delete(n)); saveLayers(); renderLayerBar(); if(typeof onLayersChanged === 'function') onLayersChanged();
      m.querySelectorAll('input[data-layer]').forEach(c => { c.checked = false; }); count(); }
  });
  m.addEventListener('change', e => {
    const c = e.target.closest('input[data-layer]'); if(!c) return;
    const name = c.dataset.layer;
    setLayer(name, c.checked);
    m.querySelectorAll('input[data-layer]').forEach(o => { if(o.dataset.layer === name){ o.checked = c.checked;  } });
    count();
  });
  $('lyQ').addEventListener('input', () => {
    const q = toHalf($('lyQ').value.trim());
    let any = false;
    m.querySelectorAll('.lrow').forEach(r => { const hit = !q || r.dataset.name.includes(q); r.hidden = !hit; if(hit) any = true; });
    m.querySelectorAll('.ldist').forEach(d => { d.open = !!q && Array.from(d.querySelectorAll('.lrow')).some(r => !r.hidden); d.hidden = !!q && !d.open; });
    m.querySelectorAll('.lsec').forEach(s => { s.hidden = !!q && !Array.from(s.querySelectorAll('.lrow')).some(r => !r.hidden); });
    $('lyNone').hidden = any;
  });
}

// legend samples for the four kinds of line
function netKeyHtml(){

  const k = (label, inner) => '<span class="netkey"><svg viewBox="0 0 26 10" aria-hidden="true">' + inner + '</svg>' + label + '</span>';

// ---------- toast & dialogs (the Claude viewer blocks alert/confirm) ----------
let toastTimer = null;
function toast(msg, ms){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms || 2800);
}
function askConfirm(msg, opts){
  opts = opts || {};
  return new Promise(resolve => {
    const ov = $('overlay');
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="sheet"><p>' + esc(msg) + '</p><div class="row">'
      + '<button class="btn ghost" type="button" data-a="no">' + esc(opts.cancel || '取消') + '</button>'
      + '<button class="btn' + (opts.danger ? ' danger' : '') + '" type="button" data-a="yes">' + esc(opts.ok || '確定') + '</button>'
      + '</div></div></div>';
    const m = ov.firstChild;
    const close = v => { ov.innerHTML = ''; document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if(e.key === 'Escape') close(false); };
    document.addEventListener('keydown', key);
    m.addEventListener('click', e => {
      if(e.target === m) return close(false);
      const a = e.target.closest('[data-a]');
      if(a) close(a.dataset.a === 'yes');
    });
    m.querySelector('[data-a="yes"]').focus();
  });
}
function showPhoto(src){
  const ov = $('overlay');
  ov.innerHTML = '<div class="modal photo" role="dialog" aria-modal="true"><img alt="照片"><button class="btn ghost close" type="button">關閉</button></div>';
  const m = ov.firstChild;
  m.querySelector('img').src = src;
  const close = () => { ov.innerHTML = ''; document.removeEventListener('keydown', key); };
  const key = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  m.addEventListener('click', e => { if(e.target === m || e.target.closest('.close')) close(); });
}

// ---------- photos ----------
function loadImage(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
// keep each photo under ~230 KB so one photo fits one stored document
async function resizeImage(file){
  const img = await loadImage(file);
  let dim = 1100, q = 0.62, out = '';
  for(let i = 0; i < 6; i++){
    let w = img.width, h = img.height;
    const s = Math.min(1, dim / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    out = c.toDataURL('image/jpeg', q);
    if(out.length < 230000) break;
    dim = Math.round(dim * 0.82); q = Math.max(0.4, q - 0.06);
  }
  return out;
}
function photoPicker(el, max){

function parseLatLngText(t){
  t = String(t || '').trim();
  const m = t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
    || t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)
    || t.match(/[?&](?:q|query|ll|sll|destination|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)
    || t.match(/^\(?\s*(-?\d{1,3}\.\d+)\s*[,，\s]\s*(-?\d{1,3}\.\d+)\s*\)?$/);
  if(!m) return null;
  let a = +m[1], b = +m[2];
  if(Math.abs(a) > 90 && Math.abs(b) <= 90){ const t2 = a; a = b; b = t2; }
  if(!(a >= -90 && a <= 90 && b >= -180 && b <= 180)) return null;
  return { lat: a, lng: b };
}

function tpcDisplay(v){

// ---------- line map ----------
// Drawn on the TWD97 TM2 plane (metres). The Claude viewer blocks map tiles, so the
// background is the real 電力座標 grid instead: 80×50 km zones when zoomed out,
// 800×500 m blocks (labelled like the plates, e.g. G8152), then 100 m cells (FC).
// The map only covers 桃園市: view, panning and markers are limited to this box.
const REGION = { name: '桃園市', s: 24.585, n: 25.135, w: 120.975, e: 121.505 };
function inRegion(o){ return hasLoc(o) && o.lat >= REGION.s && o.lat <= REGION.n && o.lng >= REGION.w && o.lng <= REGION.e; }
// approximate district centres, only used as orientation labels on the blank map
const DISTRICTS = [['桃園區',24.990,121.305],['中壢區',24.962,121.220],['平鎮區',24.925,121.210],['八德區',24.935,121.290],
  ['楊梅區',24.905,121.140],['蘆竹區',25.055,121.290],['大溪區',24.860,121.300],['龍潭區',24.850,121.225],['龜山區',25.010,121.360],
  ['大園區',25.065,121.200],['觀音區',25.030,121.110],['新屋區',24.960,121.070],['復興區',24.720,121.380]];
// ---- streets (OpenStreetMap, shipped as roads.json next to the page) ----
// road: { n: name, c: 'a' main | 'b' secondary | 'c' local, p: [[lng, lat], ...] }
let ROADS = null;
function setRoads(j){
  const list = (j && j.roads) || [];
  ROADS = list.map(r => {
    const pp = r.p.map(([lng, lat]) => TPC.toPlane(lat, lng));
    const xs = pp.map(q => q[0]), ys = pp.map(q => q[1]);
    return { n: r.n || '', c: r.c || 'c', pp, bb: { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) } };
  });
  LMap.req();
}
async function loadRoads(){
  if(!HAS_ROADS) return;   // set at build time: only ask for roads.json when it was published
  try{ const r = await fetch('roads.json', { cache: 'force-cache' }); if(r.ok) setRoads(await r.json()); }catch(e){}
}
const MAIN_ZONES = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R','T','U','V','W'];
const planeCache = new Map();
function plane(o){
  if(o._p) return o._p;
  const k = o.lat.toFixed(7) + ',' + o.lng.toFixed(7);
  let v = planeCache.get(k);
  if(!v){ v = TPC.toPlane(o.lat, o.lng); if(planeCache.size > 20000) planeCache.clear(); planeCache.set(k, v); }
  return v;
}
const LMap = {

  init(){

    // selects. Press the move button to drag / pinch the map.
    const canMove = e => e.pointerType !== 'touch' || this.unlocked;
    const hint = () => { if(!hinted){ hinted = true; toast('要移動地圖,先按右上角的十字箭頭', 3500); } };

  toScreen(x, y){ return [(x - this.cx) / this.mpp + this.W / 2, this.H / 2 - (y - this.cy) / this.mpp]; },

function nearestPole(ll, maxM){
  const [x, y] = plane(ll); let best = null;
  S.poles.forEach(p => { if(!hasLoc(p)) return; const [px, py] = plane(p); const d = Math.hypot(px - x, py - y); if(d <= maxM && (!best || d < best.d)) best = { p, d }; });
  return best;
}
function toHalf(t){ return String(t || '').replace(/[０-９Ａ-Ｚａ-ｚ＃－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function parsePoleQuery(raw){
  const t = toHalf(raw).replace(/\s+/g, '');
  if(!t) return null;
  const names = allLines();
  const shortOf = n => n.replace(/(幹線|幹|分線|線)$/, '');
  let line = null, rest = t, alts = [];
  const full = names.filter(n => t.startsWith(n)).sort((a, b) => b.length - a.length)[0];
  if(full){ line = full; rest = t.slice(full.length); }
  else {
    const hits = names.filter(n => shortOf(n) && t.startsWith(shortOf(n)));
    const best = Math.max(0, ...hits.map(n => shortOf(n).length));
    // 社尾 fits both 社尾幹 and 社尾分線: keep all of them, 幹 first; resolvePoleQuery picks the one that has the pole
    alts = hits.filter(n => shortOf(n).length === best).sort((a, b) => (b.endsWith('幹') ? 1 : 0) - (a.endsWith('幹') ? 1 : 0));
    if(alts.length){ line = alts[0]; rest = t.slice(best); }
    else if(curLine && /^#?\d/.test(t)) line = curLine;
  }
  if(!line) return null;
  rest = rest.replace(/^#/, '').toUpperCase().replace(/R/g, '右').replace(/L/g, '左');
  return { line, key: rest ? '#' + rest : '', alts };
}
// download the candidate lines, then use the one that really has this pole number
async function resolvePoleQuery(q){
  const cands = q.alts && q.alts.length > 1 ? q.alts : [q.line];
  await ensureLines(cands);
  if(cands.length === 1) return q;
  for(const n of cands) if(findPoleMatches(Object.assign({}, q, { line: n })).exact) return Object.assign({}, q, { line: n });
  if(!q.key) return q;
  for(const n of cands) if(findPoleMatches(Object.assign({}, q, { line: n })).list.length) return Object.assign({}, q, { line: n });
  return q;
}
function findPoleMatches(q){
  const all = S.byLine.get(q.line) || [];
  if(!q.key) return { exact: null, list: all };
  const exact = all.find(p => p.poleNo === q.key || p.poleNo === q.key + '(現)');
  // "#43" should suggest #43-1, #43右2 … but not #430
  const list = all.filter(p => p !== exact && p.poleNo.startsWith(q.key) && !/^\d/.test(p.poleNo.slice(q.key.length)));
  return { exact, list };
}

function findRoad(raw){
  if(!ROADS) return null;
  const q = String(raw || '').trim().replace(/\s+/g, '');
  if(q.length < 2) return null;
  let hits = ROADS.filter(r => r.n === q);

  if(!hits.length) return null;
