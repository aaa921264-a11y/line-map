let wake = null, hiddenAt = 0, pendingGap = false;

function dist(a, b){ const [ax, ay] = plane(a), [bx, by] = plane(b); return Math.hypot(bx - ax, by - ay); }
function km(pts){ let d = 0; for(let i = 1; i < pts.length; i++) if(!pts[i].gap) d += dist(pts[i - 1], pts[i]); return d / 1000; }
const DIRS = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
function bearing(a, b){
  const [ax, ay] = plane(a), [bx, by] = plane(b);
  const deg = (Math.atan2(bx - ax, by - ay) * 180 / Math.PI + 360) % 360;
  return DIRS[Math.round(deg / 45) % 8];
}
function fmtM(m){ return m < 1000 ? Math.round(m) + ' 公尺' : (m / 1000).toFixed(m < 10000 ? 2 : 1) + ' 公里'; }
function fmtDur(ms){ const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? h + ' 小時 ' + (m % 60) + ' 分' : m + ' 分'; }
function hhmm(t){ const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function ymd(t){ const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const gmapsAt = o => 'https://www.google.com/maps/search/?api=1&query=' + o.lat.toFixed(6) + ',' + o.lng.toFixed(6);
const gmapsTo = o => 'https://www.google.com/maps/dir/?api=1&destination=' + o.lat.toFixed(6) + ',' + o.lng.toFixed(6) + '&travelmode=driving';

// ---------- what the map draws on top (called from LMap.draw) ----------
function mapOverlay(L){
  let out = '';
  const pl = (pts, cls) => {
    let seg = [], last = null;
    const flush = () => { if(seg.length > 1) out += '<polyline class="' + cls + '" points="' + seg.join(' ') + '"/>'; seg = []; };
    pts.forEach(p => {
      if(p.gap){ flush(); last = null; }
      const [x, y] = L.toScreen(...plane(p));
      if(last && Math.abs(x - last[0]) + Math.abs(y - last[1]) < 1.5) return;
      last = [x, y]; seg.push(x.toFixed(1) + ',' + y.toFixed(1));
    });
    flush();
  };
  if(shown) pl(shown.points, 'trk');
  if(rec && rec.points.length) pl(rec.points.concat(rec.on && me ? [me] : []), 'trk live');
  if(me){
    const [x, y] = L.toScreen(...plane(me));
    const near = nearestPole(me, 3000);
    if(near){
      const [px, py] = L.toScreen(...plane(near.p));
      out += '<line class="near-ln" x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + px.toFixed(1) + '" y2="' + py.toFixed(1) + '"/>'
        + '<circle class="near-ring" cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="10"/>';
    }
    const r = me.acc / L.mpp;
    if(r > 9) out += '<circle class="me-acc" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + Math.min(r, 4000).toFixed(1) + '"/>';
    if(me.heading != null && me.speed > 1){
      const a = me.heading * Math.PI / 180, s = Math.sin(a), c = Math.cos(a);
      const P = (d, w) => (x + s * d + c * w).toFixed(1) + ' ' + (y - c * d + s * w).toFixed(1);
      out += '<path class="me-head" d="M' + P(26, 0) + 'L' + P(4, 9) + 'L' + P(4, -9) + 'Z"/>';
    }
    out += '<circle class="me-dot" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="8"/>';
  }
  return out;
}

// ---------- GPS ----------
function setChip(text, bad){ const c = $('gpsChip'); c.textContent = text; c.className = 'store-chip' + (bad ? ' bad' : ''); }
function startGps(){
  $('gpsErr').hidden = true;
  if(!('geolocation' in navigator)){ showGpsErr('這支手機的瀏覽器不支援定位。'); return; }
  if(window.isSecureContext === false){ showGpsErr('定位只能在 https 網址使用。請用 https:// 開頭的網址開啟這個網頁。'); return; }
  if(watchId != null) return;
  setChip('定位中…');
  $('gpsStart').hidden = true;
  watchId = navigator.geolocation.watchPosition(onFix, onGpsErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  try{ localStorage.setItem('lm:gpsOk', '1'); }catch(e){}
}
function stopGps(){ if(watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; } }
function showGpsErr(html){ const el = $('gpsErr'); el.innerHTML = html; el.hidden = false; $('gpsStart').hidden = false; setChip('沒有定位', true); }
function onGpsErr(err){
  if(err.code === 1){
    stopGps();
    try{ localStorage.removeItem('lm:gpsOk'); }catch(e){}
    showGpsErr('<b>沒有定位權限。</b>iPhone 請到「設定 → 隱私權與安全性 → 定位服務」確認已開啟,並在下方「Safari 網站」選「使用 App 期間」;'
      + '再回到這頁,按網址列左邊的「大小」圖示 →「網站設定」→ 位置選「允許」。Android 請在 Chrome 網址列左邊的鎖頭 → 權限 → 位置 → 允許。設定好後按「開始定位」。');
  } else if(err.code === 3){
    setChip('等待 GPS 訊號…', true);   // keep watching; it often comes back
  } else {
    // keep the watch running: phones often lose the fix for a moment (tunnels, under bridges)
    setChip('訊號中斷,重新抓取中…', true);
    if(!me){ const el = $('gpsErr'); el.textContent = '暫時抓不到位置。請到空曠處、確認手機定位已開啟,會自動再試。'; el.hidden = false; }
  }
}
function onFix(pos){
  const c = pos.coords;
  const fix = { lat: c.latitude, lng: c.longitude, acc: c.accuracy || 999, heading: c.heading, speed: c.speed, t: pos.timestamp || Date.now() };
  me = fix; lastFixAt = Date.now();
  $('gpsErr').hidden = true; $('gpsStart').hidden = true;
  setChip(fix.acc > MAX_ACC ? '訊號弱 ±' + Math.round(fix.acc) + 'm' : '定位中 ±' + Math.round(fix.acc) + 'm', fix.acc > MAX_ACC);
  if(rec && rec.on) addPoint(fix);
  loadAroundMe();
  if(follow && inRegion(me)){
    const [x, y] = plane(me);
    LMap.cx = x; LMap.cy = y;
    if(firstFix) LMap.mpp = Math.min(LMap.mpp, 1.6);
  }
  if(firstFix){
    firstFix = false;
    if(!inRegion(me)) $('mapOutside').hidden = false, $('mapOutside').textContent = '你目前不在桃園市範圍內,地圖上不會顯示藍點,但下方仍會列出位置與導航按鈕。';
  }
  LMap.req();
  renderMe();
}
// download the lines that pass near me, so "nearest pole" covers every trunk line, not only open layers
let nearLoadedAt = null;
function loadAroundMe(){
  if(!me || !inRegion(me)) return;
  if(nearLoadedAt && dist(nearLoadedAt, me) < 300) return;
  nearLoadedAt = { lat: me.lat, lng: me.lng };
  ensureNear(me, 800).then(() => { renderMe(); LMap.req(); });
}
function renderMe(){
  if(!me){ $('meCard').hidden = true; $('nearCard').hidden = true; return; }
  $('meCard').hidden = false;
  $('meText').textContent = coordText(me);
  $('meSub').textContent = '誤差約 ' + Math.round(me.acc) + ' 公尺' + (me.speed > 1 ? ',時速約 ' + Math.round(me.speed * 3.6) + ' 公里' : '') + ',' + hhmm(me.t) + ' 更新';
  const code = codeFor(me);
  $('mePlate').outerHTML = '<span id="mePlate">' + plateHtml(code, '我的電力座標') + '</span>';
  $('meBtns').innerHTML = '<a class="btn sm" href="' + gmapsAt(me) + '" target="_blank" rel="noopener">在 Google 地圖開啟</a>'
    + '<button class="btn ghost sm" type="button" data-copy="' + coordText(me).replace(' ', '') + '">複製座標</button>'
    + (code ? '<button class="btn ghost sm" type="button" data-copy="' + esc(code) + '">複製電力座標</button>' : '')
    + (follow ? '' : '<button class="btn ghost sm" type="button" data-act="follow">回到我的位置</button>');
  const near = nearestPole(me, 3000);
  if(!near){ $('nearCard').hidden = true; return; }
  const p = near.p;
  $('nearCard').hidden = false;
  $('nearName').textContent = p.poleNo ? shortLine(p.line) + p.poleNo + '(' + p.line + ')' : p.line + ' 未編號';
  $('nearSub').textContent = '在你的' + bearing(me, p) + '方 ' + fmtM(near.d) + (p.form ? ',' + p.form : '');
  $('nearPlate').innerHTML = plateHtml(codeFor(p), p.line);
  $('nearBtns').innerHTML = '<a class="btn sm" href="' + gmapsTo(p) + '" target="_blank" rel="noopener">Google 導航到這支桿</a>'
    + '<button class="btn ghost sm" type="button" data-act="show-pole" data-id="' + esc(p.id) + '">在地圖上看</button>'
    + (codeFor(p) ? '<button class="btn ghost sm" type="button" data-copy="' + esc(codeFor(p)) + '">複製電力座標</button>' : '');
}
function setFollow(v){
  follow = v;
  $('followBtn').setAttribute('aria-pressed', String(v));
  if(v && me){
    if(!inRegion(me)){ toast('你不在桃園市範圍內'); }
    else { const [x, y] = plane(me); LMap.cx = x; LMap.cy = y; LMap.mpp = Math.min(LMap.mpp, 2.5); LMap.draw(); }
  }
  if(v && !me) startGps();
  renderMe();
}

// ---------- track recording ----------
function saveRec(){ if(!lsSet('lm:rec', rec)) $('trkKeep').hidden = false, $('trkKeep').textContent = '手機空間不足,軌跡無法暫存。請先匯出並刪除舊軌跡。'; }
let saveTimer = null;
function saveRecSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveRec, 1500); }
function addPoint(f){
  if(f.acc > MAX_ACC) return;
  const pts = rec.points, last = pts[pts.length - 1];
  const p = { lat: +f.lat.toFixed(6), lng: +f.lng.toFixed(6), t: f.t, acc: Math.round(f.acc) };
  if(last){
    const d = dist(last, p), dt = p.t - last.t;
    if(d < MIN_STEP && !(dt >= MAX_WAIT && d >= Math.max(3, f.acc / 2))) return;
    // the screen was off, or we jumped far between fixes: don't draw a straight line across
    if(pendingGap || (dt > 90000 && d > 300)) p.gap = true;
  }
  pendingGap = false;
  pts.push(p);
  saveRecSoon();
  renderRec();
}
async function keepAwake(){
  if(!('wakeLock' in navigator)){
    $('trkKeep').hidden = false;
    $('trkKeep').textContent = '這支手機不支援「螢幕保持開啟」。記錄時請到「設定 → 螢幕顯示與亮度 → 自動鎖定」暫時改成「永不」,記完再改回來。';
    return;
  }
  try{ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); $('trkKeep').hidden = true; }
  catch(e){ $('trkKeep').hidden = false; $('trkKeep').textContent = '無法讓螢幕保持開啟。記錄時請不要鎖螢幕。'; }
}
function releaseWake(){ if(wake){ try{ wake.release(); }catch(e){} wake = null; } }
function startRec(){
  if(!rec) rec = { id: uid(), startedAt: Date.now(), points: [], on: true, gaps: 0 };
  else { rec.on = true; pendingGap = rec.points.length > 0; }
  saveRec();
  keepAwake();
  if(watchId == null) startGps();
  if(me && Date.now() - lastFixAt < 15000) addPoint(me);
  setFollow(true);
  renderRec();
  toast('開始記錄軌跡。請保持這個畫面開著。');
}
function pauseRec(){ if(!rec) return; rec.on = false; saveRec(); releaseWake(); renderRec(); }
async function finishRec(){
  if(!rec) return;
  const pts = rec.points;
  if(pts.length < 2){
    if(!(await askConfirm('這次只記到 ' + pts.length + ' 個點,要直接丟掉嗎?', { ok: '丟掉', danger: true }))) return;
    rec = null; try{ localStorage.removeItem('lm:rec'); }catch(e){}
    releaseWake(); renderRec(); LMap.req(); return;
  }
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const t = { id: rec.id, name: ymd(t0) + ' ' + hhmm(t0) + '–' + hhmm(t1) + ' 行車軌跡', date: ymd(t0), start: t0, end: t1, km: +km(pts).toFixed(2), points: pts };
  tracks.unshift(t);
  let dropped = 0;
  while(tracks.length > MAX_TRACKS){ tracks.pop(); dropped++; }
  while(!lsSet('lm:tracks', tracks) && tracks.length > 1){ tracks.pop(); dropped++; }
  rec = null; try{ localStorage.removeItem('lm:rec'); }catch(e){}
  releaseWake();
  shown = t;
  renderRec(); renderTracks(); LMap.req();
  toast('已存檔:' + t.km + ' 公里。按「匯出 GPX」交到紀錄網頁。' + (dropped ? '(最舊的 ' + dropped + ' 筆已刪除)' : ''), 5000);
}
function renderRec(){
  const btn = $('recBtn'), st = $('trkStats');
  $('recBadge').hidden = !(rec && rec.on);
  if(!rec){
    btn.textContent = '開始記錄軌跡'; btn.className = 'btn wide';
    st.textContent = '還沒開始記錄。';
    $('trkGap').hidden = true; $('trkExtra') && $('trkExtra').remove();
    return;
  }
  const pts = rec.points, d = km(pts), t0 = pts.length ? pts[0].t : rec.startedAt;
  const gaps = pts.filter(p => p.gap).length;
  st.innerHTML = '<b>' + d.toFixed(2) + '</b>公里 · ' + fmtDur((pts.length ? pts[pts.length - 1].t : Date.now()) - t0) + ' · ' + pts.length + ' 個點'
    + '<br><span class="hint" style="margin:0">' + (rec.on ? '從 ' + hhmm(t0) + ' 開始記錄中' : '已暫停(按「繼續記錄」接著記,或「結束並存檔」)') + '</span>';
  $('trkGap').hidden = !gaps;
  if(gaps) $('trkGap').textContent = '有 ' + gaps + ' 段因為螢幕關閉或訊號中斷沒有記到,地圖上這幾段不會連線。';
  if(rec.on){ btn.textContent = '暫停記錄'; btn.className = 'btn wide stop'; }
  else { btn.textContent = '繼續記錄'; btn.className = 'btn wide'; }
  if(!$('trkExtra')){
    const b = document.createElement('button');
    b.id = 'trkExtra'; b.type = 'button'; b.className = 'btn ghost wide'; b.textContent = '結束並存檔';
    b.addEventListener('click', finishRec);
    btn.parentNode.appendChild(b);
  }
}

// ---------- saved tracks ----------
function gpx(t){
  const x = s => String(s).replace(/[<&>"]/g, c => ({ '<': '&lt;', '&': '&amp;', '>': '&gt;', '"': '&quot;' }[c]));
  let segs = [], cur = [];
  t.points.forEach(p => { if(p.gap && cur.length){ segs.push(cur); cur = []; } cur.push(p); });
  if(cur.length) segs.push(cur);
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="線路定位地圖" xmlns="http://www.topografix.com/GPX/1/1">\n'
    + '<metadata><name>' + x(t.name) + '</name><time>' + new Date(t.start).toISOString() + '</time></metadata>\n<trk><name>' + x(t.name) + '</name>\n'
    + segs.map(s => '<trkseg>\n' + s.map(p => '<trkpt lat="' + p.lat.toFixed(6) + '" lon="' + p.lng.toFixed(6) + '"><time>' + new Date(p.t).toISOString() + '</time></trkpt>').join('\n') + '\n</trkseg>').join('\n')
    + '\n</trk>\n</gpx>\n';
}
async function exportGpx(t){
  const name = '軌跡_' + t.date + '_' + hhmm(t.start).replace(':', '') + '.gpx';
  const blob = new Blob([gpx(t)], { type: 'application/gpx+xml' });
  try{
    const file = new File([blob], name, { type: 'application/gpx+xml' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: t.name });
      return 'share';
    }
  }catch(e){ if(e && e.name === 'AbortError') return 'cancel'; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已下載 ' + name + '。到紀錄網頁的「巡修」→ 附上軌跡,選這個檔案。', 5000);
  return 'download';
}
function renderTracks(){
  $('trkCount').textContent = tracks.length ? tracks.length + ' 筆' : '';
  if(!tracks.length){ $('trkList').innerHTML = '<div class="empty">還沒有存好的軌跡。</div>'; return; }
  $('trkList').innerHTML = tracks.map(t => '<article class="item trk-item"><div><div class="title">' + esc(t.name) + '</div>'
    + '<div class="meta num">' + t.km + ' 公里 · ' + fmtDur(t.end - t.start) + ' · ' + t.points.length + ' 個點' + (shown && shown.id === t.id ? ' · 地圖上顯示中' : '') + '</div></div>'
    + '<div class="row"><button class="btn sm" type="button" data-t="gpx" data-id="' + t.id + '">匯出 GPX</button>'
    + '<button class="btn ghost sm" type="button" data-t="show" data-id="' + t.id + '">' + (shown && shown.id === t.id ? '不顯示' : '在地圖上看') + '</button>'
    + '<button class="btn danger sm" type="button" data-t="del" data-id="' + t.id + '">刪除</button></div></article>').join('');
}
$('trkList').addEventListener('click', async e => {
  const b = e.target.closest('[data-t]'); if(!b) return;
  const t = tracks.find(x => x.id === b.dataset.id); if(!t) return;
  if(b.dataset.t === 'gpx') exportGpx(t);
  if(b.dataset.t === 'show'){
    if(shown && shown.id === t.id){ shown = null; LMap.req(); }
    else { shown = t; setFollow(false); LMap.fit(t.points); $('mapWrap').scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    renderTracks();
  }
  if(b.dataset.t === 'del'){
    if(!(await askConfirm('刪除「' + t.name + '」?刪了就找不回來,如果還沒匯出 GPX 請先匯出。', { ok: '刪除', danger: true }))) return;
    tracks = tracks.filter(x => x !== t); lsSet('lm:tracks', tracks);
    if(shown === t) shown = null;
    renderTracks(); LMap.req();
  }
});

// ---------- tapping a pole / search result ----------
function renderPlace(){
  const el = $('placePanel'), key = LMap.sel;
  let ll = null, kind = '', name = '', caption = '';
  if(key === 'found' && LMap.found){ ll = LMap.found; kind = '電力座標查詢結果'; name = LMap.found.label; }
  else if(key && key.startsWith('pole:')){
    const p = S.poles.find(x => 'pole:' + x.id === key);
    if(p){ ll = p; kind = NET_LABEL[netOf(p)] + ' · ' + p.line + (p.form ? ' · ' + p.form : ''); name = p.poleNo ? shortLine(p.line) + p.poleNo : '未編號'; caption = p.line; }
  }
  if(!ll){ el.innerHTML = ''; return; }
  const far = me ? '離你 ' + fmtM(dist(me, ll)) + ',在你的' + bearing(me, ll) + '方' : '';
  el.innerHTML = '<div class="place"><div class="head"><div><div class="kind">' + esc(kind) + '</div><div class="name">' + esc(name) + '</div>'
    + (far ? '<div class="kind" style="margin-top:2px">' + far + '</div>' : '') + '</div>' + plateHtml(codeFor(ll), caption) + '</div>'
    + '<div class="coords num">' + coordText(ll) + '</div>'
    + '<div class="row">' + navHtml(ll) + '<button class="linkish" type="button" data-act="unsel">關閉</button></div></div>';
}
$('placePanel').addEventListener('click', e => { const b = e.target.closest('[data-act="unsel"]'); if(b) LMap.select(null); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act === 'follow') setFollow(true);
  if(b.dataset.act === 'show-pole'){ const p = S.poles.find(x => x.id === b.dataset.id); if(p) selectPole(p); }
});
function selectPole(p){
  setFollow(false);
  LMap.sel = 'pole:' + p.id;
  if(!LAYERS.has(p.line)){ setLayer(p.line, true); toast('已開啟「' + p.line + '」圖層'); }
  LMap.focus(p.lat, p.lng, Math.min(LMap.mpp, 1.2));
  renderPlace();
  $('qMsg').textContent = p.line + p.poleNo + (p.tpc ? '(' + p.tpc + ')' : '') + ',已在地圖上標出。';
  $('mapWrap').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
const chipList = list => '<div class="chips" style="margin-top:6px">' + list.map(p => '<button type="button" class="chip" data-pole="' + p.id + '">' + esc(p.poleNo) + '</button>').join('') + '</div>';
async function runSearch(){
  const raw = $('q').value, msg = $('qMsg');
  LMap.hiRoad = null;
  if(!raw.trim()){ msg.textContent = '請輸入電力座標、幹線加桿號,或路名。'; return; }
  const code = TPC.normalize(raw);
  const r = TPC.parse(code) ? TPC.toLatLng(code) : null;
  if(r){
    if(inRegion(r)){ msg.textContent = '查詢中…'; await ensureNear(r, 300); }
    const known = S.poles.find(p => p.tpc && TPC.normalize(p.tpc) === code);
    if(known) return selectPole(known);
    setFollow(false);
    msg.textContent = tpcDisplay(code) + ' → ' + coordText(r) + '(精度約 ' + r.precision + ' 公尺)。' + (inRegion(r) ? '' : '不在桃園市,地圖上不顯示,但可以導航。');
    LMap.showFound(r.lat, r.lng, tpcDisplay(code));
    $('mapWrap').scrollIntoView({ block: 'start', behavior: 'smooth' });
    return;
  }
  let q = parsePoleQuery(raw);
  if(q && q.key && !/\d/.test(q.key)) q = null;
  if(q){
    if(!(q.alts || [q.line]).every(lineLoaded)) msg.textContent = '下載 ' + q.line + ' 的電桿資料…';
    q = await resolvePoleQuery(q);
    const { exact, list } = findPoleMatches(q);
    if(exact) return selectPole(exact);
    if(!LAYERS.has(q.line) && list.length){ setLayer(q.line, true); toast('已開啟「' + q.line + '」圖層'); }
    if(!q.key && list.length){ setFollow(false); LMap.fit(list); msg.textContent = q.line + ' 共 ' + list.length + ' 支電桿。加上桿號找單一支,例如 ' + q.line + '43。'; return; }
    if(list.length){
      msg.innerHTML = esc(q.line + q.key) + ' 沒有完全相同的桿號,你是要找:' + chipList(list.slice().sort((a, b) => natCmp(a.poleNo, b.poleNo)).slice(0, 12));
      return;
    }
    const base = (q.key.match(/^#\d+/) || [''])[0];
    const near = base && base !== q.key ? findPoleMatches({ line: q.line, key: base }) : { exact: null, list: [] };
    const alt = (near.exact ? [near.exact] : []).concat(near.list).sort((a, b) => natCmp(a.poleNo, b.poleNo)).slice(0, 12);
    if(alt.length){ msg.innerHTML = '找不到 ' + esc(q.line + q.key) + '。' + esc(q.line + base) + ' 附近有:' + chipList(alt); return; }
    msg.textContent = '找不到 ' + q.line + q.key + '。分歧寫成 43-10,右/左可以打 R/L。';
    return;
  }
  const road = findRoad(raw);
  if(road){
    setFollow(false);
    LMap.hiRoad = road.name; LMap.sel = null; renderPlace();
    LMap.fit(road.pts.map(([x, y]) => TPC.fromPlane(x, y)));
    msg.textContent = '已顯示「' + road.name + '」' + (road.count > 1 ? '(共 ' + road.count + ' 段)' : '') + '。';
    return;
  }
  msg.innerHTML = '讀不懂「' + esc(raw) + '」。可以輸入電力座標(<b>B0721 HD63</b>)、幹線加桿號(<b>民一43</b>、<b>社尾37R1</b>)或路名(<b>中山路</b>)。';
}
$('qGo').addEventListener('click', runSearch);
$('q').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); runSearch(); } });
$('qMsg').addEventListener('click', e => {
  const b = e.target.closest('[data-pole]'); if(!b) return;
  const p = S.poles.find(x => x.id === b.dataset.pole); if(p){ $('q').value = p.line + p.poleNo; selectPole(p); }
});
function renderLegend(){
  const lines = shownLines();
  $('legend').innerHTML = lines.map(n => '<span><i class="ln" style="background:' + lineColor(n) + '"></i>' + esc(n) + '</span>').join('')
    + '<span><i style="background:#1a73e8"></i>我的位置</span><span><i style="background:var(--danger)"></i>記錄中軌跡</span><span><i style="background:var(--info)"></i>已存軌跡</span>' + netKeyHtml();
}

function onLinesLoaded(){ LMap.req(); renderMe(); renderPlace(); }
function onLayersChanged(){ renderLegend(); LMap.req(); }
// ---------- boot ----------
function bootLocator(){
  initLineIndex(LINE_INDEX_DATA, 'lm:layers', ['民一幹', '社尾幹', '新社幹', '望間分線', '望湖分線']);
  refreshLineColors(); renderLayerBar();
  $('layerBtn').addEventListener('click', openLayerSheet);
  ensureLines(Array.from(LAYERS));
  renderLegend();
  $('recordsLink').href = RECORDS_URL;
  LMap.init();
  LMap.unlocked = true; LMap.svg.classList.add('unlocked'); $('mapWrap').classList.add('unlocked');
  // dragging or pinching the map stops following the blue dot
  const fast = LMap.fast;
  LMap.fast = function(){ if(follow){ follow = false; $('followBtn').setAttribute('aria-pressed', 'false'); renderMe(); } return fast.apply(this, arguments); };
  setRoads(ROADS_DATA);
  LMap.regionView(); LMap.draw();
  ensureLines(Array.from(LAYERS)).then(() => { if(!me) LMap.fit(); });
  $('followBtn').addEventListener('click', () => setFollow(true));
  $('gpsGo').addEventListener('click', startGps);
  $('recBtn').addEventListener('click', () => { if(rec && rec.on) pauseRec(); else startRec(); });
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ hiddenAt = Date.now(); if(rec && rec.on){ pendingGap = true; saveRec(); } }
    else {
      if(rec && rec.on){
        keepAwake();
        const off = Date.now() - hiddenAt;
        if(off > 30000) toast('畫面關了 ' + fmtDur(off) + ',這段時間沒有記到軌跡。', 4000);
      }
      if(watchId == null && localStorage.getItem('lm:gpsOk')) startGps();
    }
  });
  window.addEventListener('pagehide', () => { if(rec) saveRec(); });
  if(rec){ rec.on = false; saveRec(); toast('上次的軌跡還沒結束,可以「繼續記錄」或「結束並存檔」。', 5000); }
  renderRec(); renderTracks();
  // if this phone already allowed location before, start right away
  let ok = false; try{ ok = !!localStorage.getItem('lm:gpsOk'); }catch(e){}
  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name: 'geolocation' }).then(s => { if(s.state === 'granted' || ok) startGps(); }, () => { if(ok) startGps(); });
  } else if(ok) startGps();
  // clock for the "recording for X min" line
  setInterval(() => { if(rec && rec.on) renderRec(); if(me && Date.now() - lastFixAt > 30000 && watchId != null) setChip('等待 GPS 訊號…', true); }, 15000);
}
bootLocator();

window.__lm = { LMap, S, get me(){ return me; }, get rec(){ return rec; }, get tracks(){ return tracks; }, gpx, mapOverlay, get layers(){ return LAYERS; }, setLayer, LINE_META };
})();
</script>
